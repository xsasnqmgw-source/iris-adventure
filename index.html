<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IRIS · 鸢尾花的奇遇</title>
<style>
:root {
  --iris-deep: #3B1F78;
  --iris-royal: #5C3FA0;
  --iris-mid: #7B5FC7;
  --iris-light: #A78FDE;
  --iris-petal: #CEC0F0;
  --iris-gold: #F5C842;
  --iris-gold-light: #FFE082;
  --iris-white: #F7F3FF;
  --bg-start: #120C24;
  --bg-mid: #0F0A1E;
  --bg-end: #0A0618;
  --card-bg: rgba(22, 14, 50, 0.8);
  --card-border: rgba(120, 95, 180, 0.25);
  --text: #e6deff;
  --text-dim: #a898d0;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden; overflow-y: auto;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg-start);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  -webkit-overflow-scrolling: touch;
}

#app {
  width: 100%; min-height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ============ BACKGROUND CANVAS ============ */
#bgCanvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

/* ============ SCREENS ============ */
.screen {
  position: absolute; top: 0; left: 0;
  width: 100%; min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0; pointer-events: none;
  padding: 24px 16px;
  padding-bottom: calc(24px + var(--safe-bottom));
}
.screen.active {
  opacity: 1; pointer-events: auto;
  transform: translateY(0);
}
.screen.exit-left  { opacity: 0; transform: translateX(-40px); }
.screen.exit-right { opacity: 0; transform: translateX(40px); }
.screen.enter-from-right { opacity: 0; transform: translateX(40px); }
.screen.enter-from-left  { opacity: 0; transform: translateX(-40px); }

/* ============ HOME SCREEN ============ */
#homeScreen { gap: 6px; padding-top: 40px; }

/* ---- Iris flower container ---- */
.iris-stage {
  position: relative;
  width: 200px; height: 240px;
  margin-bottom: 0;
}
.iris-stage .iris-svg-main {
  width: 100%; height: 100%;
  filter: drop-shadow(0 0 30px rgba(120,80,200,0.35));
  animation: irisGentleSway 6s ease-in-out infinite;
}
@keyframes irisGentleSway {
  0%,100% { transform: rotate(-1.5deg) translateY(0); }
  25%  { transform: rotate(0.5deg) translateY(-4px); }
  50%  { transform: rotate(1.5deg) translateY(-8px); }
  75%  { transform: rotate(-0.5deg) translateY(-3px); }
}

/* floating sparkles around iris */
.iris-stage .sparkle {
  position: absolute; pointer-events: none;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 6px 2px rgba(200,180,255,0.8);
  animation: sparkleFloat 3s ease-in-out infinite;
}
.iris-stage .sparkle:nth-child(2) { top: 15%; left: 20%; animation-delay: 0s; }
.iris-stage .sparkle:nth-child(3) { top: 10%; left: 70%; animation-delay: 1.2s; }
.iris-stage .sparkle:nth-child(4) { top: 55%; left: 85%; animation-delay: 2.4s; }
.iris-stage .sparkle:nth-child(5) { top: 70%; left: 12%; animation-delay: 0.8s; }
.iris-stage .sparkle:nth-child(6) { top: 25%; left: 50%; animation-delay: 1.8s; width:3px; height:3px; }
@keyframes sparkleFloat {
  0%,100% { opacity: 0.2; transform: translateY(0) scale(1); }
  50%  { opacity: 1; transform: translateY(-12px) scale(1.8); }
}

.home-title {
  font-size: 26px; font-weight: 700;
  color: var(--iris-white);
  text-align: center;
  letter-spacing: 2px;
  text-shadow: 0 0 30px rgba(150, 120, 220, 0.5);
  margin-top: -8px;
}
.home-subtitle {
  font-size: 14px; color: var(--text-dim);
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 1.5px;
}

/* ---- Option cards ---- */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%; max-width: 360px;
}
.option-card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 16px 12px;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.option-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(155,120,220,0.12) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.35s;
}
.option-card:active {
  transform: scale(0.95);
  border-color: rgba(155, 126, 216, 0.6);
  box-shadow: 0 0 35px rgba(100, 60, 180, 0.45);
}
.option-card:active::before { opacity: 1; }
.option-card .card-icon {
  font-size: 34px; position: relative; z-index: 1;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
}
.option-card .card-label {
  font-size: 13px; font-weight: 600;
  color: var(--text);
  position: relative; z-index: 1;
  text-align: center; line-height: 1.3;
}
.option-card.full-width { grid-column: 1 / -1; }

/* ============ GAME SCREENS ============ */
.game-header {
  position: absolute; top: 16px; left: 12px; right: 12px;
  display: flex; justify-content: space-between;
  align-items: center; z-index: 20;
}
.back-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(22,14,50,0.75);
  border: 1px solid rgba(120,95,180,0.3);
  color: var(--text);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.back-btn:active { background: rgba(100,60,170,0.4); transform: scale(0.88); }

.game-title {
  font-size: 17px; font-weight: 700;
  color: var(--iris-white);
  text-shadow: 0 0 18px rgba(150,120,220,0.45);
  text-align: center;
}

/* ============ TEMPLE GAME ============ */
.temple-scene {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px; width: 100%;
}
.temple-building { font-size: 72px; filter: drop-shadow(0 8px 24px rgba(100,60,180,0.35)); }
.bell-area {
  position: relative; width: 100px; height: 110px; cursor: pointer;
}
.bell-area .bell-emoji {
  font-size: 64px; display: block; text-align: center;
  transition: transform 0.08s;
}
.bell-area .bell-emoji.swinging {
  animation: bellSwing 0.7s ease-in-out;
}
@keyframes bellSwing {
  0%,100%{transform:rotate(0)}
  12%{transform:rotate(-16deg)}
  28%{transform:rotate(13deg)}
  44%{transform:rotate(-10deg)}
  60%{transform:rotate(7deg)}
  76%{transform:rotate(-4deg)}
  90%{transform:rotate(2deg)}
}
.bell-area .ripple-ring {
  position: absolute; top: 28px; left: 18px;
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid rgba(245,200,66,0.5);
  opacity: 0; pointer-events: none;
}
.bell-area .ripple-ring.expand {
  animation: rippleExpand 1.2s ease-out forwards;
}
@keyframes rippleExpand {
  0%{transform:scale(0.4);opacity:0.9}
  100%{transform:scale(3);opacity:0}
}
.tap-prompt { font-size: 13px; color: var(--iris-gold); animation: softPulse 2s ease-in-out infinite; }
@keyframes softPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
.worry-count { font-size: 13px; color: var(--text-dim); text-align: center; }
.worry-display {
  font-size: 13px; color: var(--iris-petal);
  text-align: center; max-width: 280px;
  line-height: 1.8; min-height: 20px;
  transition: all 0.4s;
}

/* ============ RECHARGE GAME ============ */
.breathe-scene {
  display: flex; flex-direction: column;
  align-items: center; gap: 10px; width: 100%;
}
.breathe-ring {
  width: 170px; height: 170px; border-radius: 50%;
  position: relative; display: flex;
  align-items: center; justify-content: center;
  cursor: pointer;
}
.breathe-ring .ring-bg {
  position: absolute; width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at center, rgba(120,80,200,0.25), rgba(90,60,160,0.08));
  border: 1.5px solid rgba(150,120,220,0.35);
  box-shadow: 0 0 45px rgba(100,60,170,0.25);
}
.breathe-ring .bloom-icon {
  font-size: 52px; z-index: 1;
  transition: transform 0.6s ease, font-size 0.6s ease;
}
.breathe-label {
  font-size: 16px; color: var(--text); font-weight: 600;
  text-align: center; transition: all 0.4s;
}
.breathe-sub {
  font-size: 12px; color: var(--text-dim); text-align: center;
}
.charge-track {
  width: 200px; height: 6px; background: rgba(150,120,220,0.18);
  border-radius: 3px; overflow: hidden;
}
.charge-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--iris-royal), var(--iris-gold));
  border-radius: 3px; transition: width 0.4s ease; width: 0%;
}

/* ============ FOOD GAME ============ */
.food-scene {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px; width: 100%;
}
.food-slot {
  width: 180px; height: 180px;
  background: var(--card-bg);
  border-radius: 22px;
  border: 1.5px solid rgba(150,120,220,0.3);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.food-slot .slot-emoji {
  font-size: 72px;
  transition: transform 0.08s;
}
.food-slot .slot-emoji.rolling {
  animation: slotShake 0.08s linear infinite;
}
@keyframes slotShake {
  0%{transform:translateY(0)} 25%{transform:translateY(-8px)}
  50%{transform:translateY(0)} 75%{transform:translateY(8px)} 100%{transform:translateY(0)}
}
.spin-btn {
  padding: 12px 36px;
  background: linear-gradient(135deg, var(--iris-mid), var(--iris-royal));
  border: none; border-radius: 28px;
  color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 4px 18px rgba(100,60,170,0.4);
  transition: all 0.25s;
}
.spin-btn:active { transform: scale(0.92); }
.food-result-text {
  font-size: 15px; color: var(--iris-gold);
  text-align: center; font-weight: 600;
  min-height: 22px; transition: all 0.3s;
}
.food-desc-text {
  font-size: 12px; color: var(--text-dim);
  text-align: center; max-width: 280px; line-height: 1.6;
}

/* ============ PET GAME ============ */
.pet-scene {
  display: flex; flex-direction: column;
  align-items: center; gap: 8px; width: 100%;
}
.pet-stage {
  width: 150px; height: 150px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
}
.pet-stage .pet-emoji {
  font-size: 90px;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.3));
}
.pet-stage .pet-emoji.bounce {
  animation: petBounceAnim 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes petBounceAnim {
  0%,100%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-28px) scale(1.12)}
  60%{transform:translateY(-8px) scale(0.94)}
  80%{transform:translateY(-4px) scale(1.03)}
}
.pet-stage .heart-pop {
  position: absolute; pointer-events: none;
  font-size: 22px; opacity: 0;
}
.pet-stage .heart-pop.fly {
  animation: heartRise 1.4s ease-out forwards;
}
@keyframes heartRise {
  0%{opacity:1;transform:translateY(0) scale(0.4)}
  40%{opacity:1;transform:translateY(-35px) scale(1.1)}
  100%{opacity:0;transform:translateY(-70px) scale(0.7)}
}
.pet-name-label { font-size: 15px; color: var(--text); font-weight: 600; }
.pet-desc-label { font-size: 12px; color: var(--text-dim); text-align: center; }
.pet-nav-row { display: flex; gap: 18px; }
.pet-nav-dot {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(22,14,50,0.7);
  border: 1px solid rgba(120,95,180,0.3);
  color: var(--text); font-size: 18px;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.2s;
}
.pet-nav-dot:active { background: rgba(100,60,170,0.4); }

/* ============ FORTUNE GAME ============ */
.fortune-scene {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px; width: 100%;
}
.fortune-flower-area {
  position: relative; width: 150px; height: 150px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.fortune-flower-area .ff-core {
  font-size: 60px; transition: transform 0.3s;
}
.fortune-petal-layer {
  position: absolute; width: 100%; height: 100%;
  pointer-events: none;
}
.fortune-petal-layer .fp {
  position: absolute; font-size: 22px;
  opacity: 0.75; transition: all 0.55s ease-out;
}
.fortune-petal-layer .fp.blown {
  opacity: 0;
  transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(0);
}
.fortune-result {
  font-size: 15px; color: var(--iris-gold);
  text-align: center; font-weight: 600;
  min-height: 50px; max-width: 280px;
  line-height: 1.6; transition: all 0.45s;
  opacity: 0;
}
.fortune-result.show { opacity: 1; }
.fortune-hint-text {
  font-size: 12px; color: var(--text-dim);
  animation: softPulse 2s ease-in-out infinite;
}

/* ============ PETAL RAIN ============ */
.petal-drop {
  position: fixed; pointer-events: none; z-index: 999;
  animation: petalDrift linear forwards;
}
@keyframes petalDrift {
  0%  { opacity:0; transform:translateY(-30px) rotate(0deg) scale(0.4); }
  8%  { opacity:0.85; }
  15% { opacity:0.9; transform:translateY(8vh) rotate(50deg) scale(1); }
  75% { opacity:0.4; }
  100%{ opacity:0; transform:translateY(105vh) translateX(var(--drift)) rotate(var(--spin)) scale(0.25); }
}

/* ============ RESPONSIVE ============ */
@media (min-width: 420px) {
  .options-grid { max-width: 400px; gap: 12px; }
  .option-card { padding: 20px 16px; border-radius: 20px; }
  .option-card .card-icon { font-size: 38px; }
  .option-card .card-label { font-size: 14px; }
}
@media (min-width: 768px) {
  .options-grid { max-width: 480px; gap: 14px; }
  .option-card { padding: 26px 20px; }
  .option-card .card-icon { font-size: 44px; }
  .option-card .card-label { font-size: 16px; }
  .home-title { font-size: 30px; }
  .iris-stage { width: 240px; height: 280px; }
}

/* WeChat share hint */
.wx-tip {
  position: fixed; top: 10px; right: 14px; z-index: 1000;
  font-size: 12px; color: var(--text-dim);
  background: rgba(22,14,50,0.82);
  padding: 6px 12px; border-radius: 10px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.35s;
}
.wx-tip.on { opacity: 1; }
</style>
</head>
<body>

<div id="app">
  <canvas id="bgCanvas"></canvas>

  <!-- ==================== HOME SCREEN ==================== -->
  <div class="screen active" id="homeScreen">
    <!-- Detailed Iris SVG -->
    <div class="iris-stage">
      <svg class="iris-svg-main" viewBox="0 0 200 240">
        <defs>
          <!-- Standard petal gradient (lighter, lavender) -->
          <linearGradient id="stdGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#8B6DCF"/>
            <stop offset="35%" stop-color="#AD93E5"/>
            <stop offset="70%" stop-color="#CEC0F0"/>
            <stop offset="100%" stop-color="#E8E0FA"/>
          </linearGradient>
          <linearGradient id="stdGradSide" x1="0.3" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#7B5FC7"/>
            <stop offset="40%" stop-color="#A085DD"/>
            <stop offset="100%" stop-color="#D5CAF2"/>
          </linearGradient>
          <!-- Fall petal gradient (deep dramatic purple) -->
          <linearGradient id="fallGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5C3FA0"/>
            <stop offset="30%" stop-color="#462E85"/>
            <stop offset="70%" stop-color="#3B1F78"/>
            <stop offset="100%" stop-color="#2A1060"/>
          </linearGradient>
          <linearGradient id="fallGradSide" x1="0.2" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#503894"/>
            <stop offset="50%" stop-color="#3E2578"/>
            <stop offset="100%" stop-color="#200848"/>
          </linearGradient>
          <!-- Beard gradient (yellow fuzzy signal) -->
          <linearGradient id="beardGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF8E1"/>
            <stop offset="25%" stop-color="#FFE082"/>
            <stop offset="60%" stop-color="#F5C842"/>
            <stop offset="100%" stop-color="#C89820"/>
          </linearGradient>
          <radialGradient id="beardGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.9"/>
            <stop offset="60%" stop-color="#FFE082" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#F5C842" stop-opacity="0"/>
          </radialGradient>
          <!-- Leaf gradient -->
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2E7D32"/>
            <stop offset="50%" stop-color="#43A047"/>
            <stop offset="100%" stop-color="#66BB6A"/>
          </linearGradient>
          <linearGradient id="leafGrad2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#388E3C"/>
            <stop offset="100%" stop-color="#81C784"/>
          </linearGradient>
          <!-- Filters -->
          <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a0a3a" flood-opacity="0.35"/>
          </filter>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="beardBlur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>
        </defs>

        <!-- ===== STEM ===== -->
        <path d="M100,232 Q98,195 100,160 Q101,130 99,100"
              stroke="#4A8C4A" stroke-width="3.5" fill="none" stroke-linecap="round"/>

        <!-- ===== LEAVES (sword-shaped, overlapping) ===== -->
        <!-- Left leaf -->
        <path d="M99,195 Q70,180 30,165 Q50,155 75,165 Q92,173 99,185"
              fill="url(#leafGrad)" opacity="0.9"/>
        <!-- Right leaf -->
        <path d="M100,180 Q130,165 170,148 Q155,140 130,150 Q108,158 100,170"
              fill="url(#leafGrad2)" opacity="0.85"/>
        <!-- Smaller back leaf left -->
        <path d="M99,210 Q55,200 20,188 Q45,180 70,190 Q90,197 99,203"
              fill="url(#leafGrad)" opacity="0.7"/>
        <!-- Smaller back leaf right -->
        <path d="M100,200 Q140,188 175,175 Q155,168 130,178 Q110,186 100,193"
              fill="url(#leafGrad2)" opacity="0.65"/>

        <!-- ===== OVARY / RECEPTACLE (small green bulge at base) ===== -->
        <ellipse cx="100" cy="150" rx="6" ry="10" fill="#5B8C5A" opacity="0.7"/>

        <!-- ===== FALLS (3 drooping petals with beards) ===== -->
        <!-- Center fall -->
        <g filter="url(#petalShadow)">
          <path d="M100,132
                   C85,136 60,150 42,172
                   C35,180 32,190 40,195
                   C52,202 72,206 100,208
                   C128,206 148,202 160,195
                   C168,190 165,180 158,172
                   C140,150 115,136 100,132Z"
                fill="url(#fallGrad)" stroke="rgba(60,30,100,0.3)" stroke-width="0.8"/>
        </g>
        <!-- Center fall beard -->
        <ellipse cx="100" cy="172" rx="18" ry="28" fill="url(#beardGlow)" filter="url(#beardBlur)" opacity="0.6"/>
        <path d="M100,148 Q95,165 100,190 Q105,165 100,148"
              fill="url(#beardGrad)" opacity="0.85"/>
        <!-- Beard fuzz lines -->
        <g stroke="#D4A020" stroke-width="0.5" opacity="0.5" fill="none">
          <path d="M92,158 L96,172"/>
          <path d="M96,154 L98,174"/>
          <path d="M100,152 L100,176"/>
          <path d="M104,154 L102,174"/>
          <path d="M108,158 L104,172"/>
        </g>
        <!-- Fall veins -->
        <g stroke="rgba(30,8,60,0.3)" stroke-width="0.6" fill="none">
          <path d="M100,135 Q95,155 88,185"/>
          <path d="M100,135 Q90,160 78,190"/>
          <path d="M100,135 Q105,155 112,185"/>
          <path d="M100,135 Q110,160 122,190"/>
        </g>

        <!-- Left fall -->
        <g filter="url(#petalShadow)">
          <path d="M88,138

<script>
// ──────────────────────────────────
// BACKGROUND CANVAS — floating iris petals
// ──────────────────────────────────
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const bgParticles = [];
class BgPetal {
  constructor(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : -20;
    this.w = Math.random() * 8 + 4;
    this.h = this.w * 2.2;
    this.vy = Math.random() * 0.4 + 0.15;
    this.vx = (Math.random() - 0.5) * 0.35;
    this.rot = Math.random() * 360;
    this.vr = (Math.random() - 0.5) * 0.4;
    this.alpha = Math.random() * 0.35 + 0.08;
    this.purple = Math.random() < 0.65;
  }
  update() {
    this.y += this.vy;
    this.x += this.vx + Math.sin(this.y * 0.02) * 0.15;
    this.rot += this.vr;
    if (this.y > H + 30) { this.y = -20; this.x = Math.random() * W; }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot * Math.PI / 180);
    ctx.globalAlpha = this.alpha;
    // Iris-petal-shaped
    ctx.fillStyle = this.purple ? 'rgba(155,120,215,1)' : 'rgba(245,200,66,0.8)';
    ctx.beginPath();
    ctx.ellipse(0, 0, this.w, this.h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 45; i++) bgParticles.push(new BgPetal(true));

(function loop() {
  ctx.clearRect(0, 0, W, H);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#120C24');
  grad.addColorStop(0.45, '#0F0A1E');
  grad.addColorStop(1, '#0A0618');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  bgParticles.forEach(p => { p.update(); p.draw(ctx); });
  requestAnimationFrame(loop);
})();

// ──────────────────────────────────
// SCREEN NAVIGATION
// ──────────────────────────────────
let currentScreen = 'home';

function showScreen(id, dir) {
  const oldEl = document.getElementById(currentScreen + 'Screen');
  const newEl = document.getElementById(id + 'Screen');
  if (!oldEl || !newEl || currentScreen === id) return;

  ['exit-left','exit-right','enter-from-right','enter-from-left'].forEach(c => {
    oldEl.classList.remove(c); newEl.classList.remove(c);
  });

  if (dir === 'forward') {
    oldEl.classList.add('exit-left');
    newEl.classList.add('enter-from-right');
  } else {
    oldEl.classList.add('exit-right');
    newEl.classList.add('enter-from-left');
  }

  oldEl.classList.remove('active');
  newEl.classList.add('active');

  setTimeout(() => {
    oldEl.classList.remove('exit-left','exit-right');
    newEl.classList.remove('enter-from-right','enter-from-left');
  }, 500);

  currentScreen = id;
}

function goHome() { showScreen('home', 'back'); resetAll(); }

// ──────────────────────────────────
// PETAL BURST
// ──────────────────────────────────
function burstPetals(count) {
  const emojis = ['💜','🌸','🪻','🔮','✨','💫','🍃'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'petal-drop';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (Math.random() * 80 + 8) + '%';
    el.style.top = -(Math.random() * 50 + 10) + 'px';
    el.style.animationDuration = (Math.random() * 2.5 + 3) + 's';
    el.style.setProperty('--drift', (Math.random() - 0.5) * 120 + 'px');
    el.style.setProperty('--spin', (Math.random() * 360) + 'deg');
    el.style.fontSize = (Math.random() * 14 + 14) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

// ──────────────────────────────────
// CARD CLICK → GAME LAUNCH
// ──────────────────────────────────
document.querySelectorAll('.option-card').forEach(card => {
  card.addEventListener('click', function() {
    const screen = this.dataset.screen;
    burstPetals(12);
    showScreen(screen, 'forward');
    if (screen === 'temple') initTemple();
    else if (screen === 'recharge') initRecharge();
    else if (screen === 'food') initFood();
    else if (screen === 'pet') initPet();
    else if (screen === 'fortune') initFortune();
  });
});

// ──────────────────────────────────
// TEMPLE
// ──────────────────────────────────
const worries = [
  '工作上的一点小疲惫',
  '深夜辗转反侧的失眠',
  '莫名其妙涌上来的焦虑',
  '和别人比较后的小失落',
  '对未来的那一点点迷茫'
];
let worryIdx = 0, templeOn = false;

function initTemple() {
  worryIdx = 0; templeOn = true;
  document.getElementById('worryCount').innerHTML = '✨ 还有 <b>' + worries.length + '</b> 个烦恼等待消散';
  document.getElementById('worryDisplay').textContent = '深呼吸，准备好迎接平静了吗？';
}

document.getElementById('bellArea').addEventListener('click', function() {
  if (!templeOn || currentScreen !== 'temple') return;

  const bell = document.getElementById('bellEmoji');
  const ripple = document.getElementById('rippleRing');
  const display = document.getElementById('worryDisplay');
  const counter = document.getElementById('worryCount');

  bell.classList.remove('swinging');
  void bell.offsetWidth;
  bell.classList.add('swinging');

  ripple.classList.remove('expand');
  void ripple.offsetWidth;
  ripple.classList.add('expand');

  burstPetals(8);

  if (worryIdx < worries.length) {
    display.textContent = '「' + worries[worryIdx] + '」—— 被钟声带走了 ✨';
    worryIdx++;
    const rem = worries.length - worryIdx;
    if (rem > 0) {
      counter.innerHTML = '✨ 还有 <b>' + rem + '</b> 个烦恼等待消散';
    } else {
      counter.innerHTML = '🎉 <b>全部消散！</b>';
      display.textContent = '所有烦恼都随鸢尾花瓣飘走了～\nIRIS，你是最棒的！💜';
      templeOn = false;
      setTimeout(() => burstPetals(25), 350);
    }
  }
});

// ──────────────────────────────────
// RECHARGE (4-7-8 breathing)
// ──────────────────────────────────
let phase = 0, cycles = 0, breatheOn = false, breatheTimer = null;
const phaseMap = {
  0: { label:'准备好了吗？', sub:'跟着鸢尾花的节奏呼吸', scale:1, icon:'🪷' },
  1: { label:'吸气……', sub:'慢慢吸 ~ 4 秒', scale:1.55, icon:'🌸' },
  2: { label:'屏住呼吸', sub:'保持住 ~ 7 秒', scale:1.55, icon:'🌺' },
  3: { label:'呼气……', sub:'缓缓呼 ~ 8 秒', scale:1, icon:'🪷' }
};

function initRecharge() {
  clearBreatheTimer();
  phase = 0; cycles = 0; breatheOn = true;
  applyBreathePhase();
  document.getElementById('chargeFill').style.width = '0%';
}

function clearBreatheTimer() { if (breatheTimer) { clearTimeout(breatheTimer); breatheTimer = null; } }

function applyBreathePhase() {
  const p = phaseMap[phase];
  document.getElementById('breatheLabel').textContent = p.label;
  document.getElementById('breatheSub').textContent = p.sub;
  const icon = document.getElementById('bloomIcon');
  icon.textContent = p.icon;
  icon.style.transform = 'scale(' + p.scale + ')';
  icon.style.fontSize = (52 * p.scale) + 'px';
}

function runBreatheCycle() {
  if (!breatheOn || currentScreen !== 'recharge') return;
  switch (phase) {
    case 0:
      phase = 1; applyBreathePhase(); burstPetals(4);
      breatheTimer = setTimeout(runBreatheCycle, 4000);
      break;
    case 1:
      phase = 2; applyBreathePhase();
      breatheTimer = setTimeout(runBreatheCycle, 7000);
      break;
    case 2:
      phase = 3; applyBreathePhase();
      breatheTimer = setTimeout(runBreatheCycle, 8000);
      break;
    case 3:
      cycles++;
      document.getElementById('chargeFill').style.width = Math.min(cycles * 25, 100) + '%';
      if (cycles >= 4) {
        document.getElementById('breatheLabel').textContent = '🔋 充满电了！';
        document.getElementById('breatheSub').textContent = 'IRIS，你现在能量满满 ✨';
        const icon = document.getElementById('bloomIcon');
        icon.textContent = '🌷';
        icon.style.transform = 'scale(1.65)';
        icon.style.fontSize = '72px';
        breatheOn = false;
        burstPetals(20);
        return;
      }
      phase = 1; applyBreathePhase(); burstPetals(3);
      breatheTimer = setTimeout(runBreatheCycle, 4000);
      break;
  }
}

document.getElementById('breatheRing').addEventListener('click', function() {
  if (!breatheOn) { initRecharge(); setTimeout(() => runBreatheCycle(), 500); return; }
  if (phase === 0) runBreatheCycle();
});

// ──────────────────────────────────
// FOOD SLOT
// ──────────────────────────────────
const foodList = [
  { emoji:'🍜', name:'热腾腾的拉面', desc:'一碗浓郁豚骨拉面，配上溏心蛋和叉烧，暖到心里！今天就出发～' },
  { emoji:'🍣', name:'精致寿司拼盘', desc:'三文鱼、金枪鱼、鳗鱼…新鲜到发光！约上朋友去吃日料吧～' },
  { emoji:'🍕', name:'芝士瀑布披萨', desc:'拉丝拉到天花板！碳水使人快乐，今天别委屈自己～' },
  { emoji:'🌮', name:'墨西哥塔可', desc:'酸辣开胃，一口一个！换个口味尝尝异国风情吧～' },
  { emoji:'🍰', name:'草莓奶油蛋糕', desc:'甜食治愈一切。下午茶配拿铁，完美的 me time～' },
  { emoji:'🍲', name:'咕噜咕噜小火锅', desc:'毛肚虾滑肥牛…冲冲冲！一个人也可以很丰盛！' },
  { emoji:'🍗', name:'酥脆多汁炸鸡', desc:'咔嚓咔嚓的声音就是幸福～配冰可乐，双倍快乐！' },
  { emoji:'🍦', name:'梦幻三球冰淇淋', desc:'香草+抹茶+草莓，夏天的快乐就是这么简单！' },
  { emoji:'🥟', name:'热乎手工饺子', desc:'皮薄馅大，蘸醋吃。简单朴实但超满足～' },

document.getElementById('spinBtn').addEventListener('click', function() {
  if (spinning || currentScreen !== 'food') return;

  const slot = document.getElementById('slotEmoji');
  const result = document.getElementById('foodResultText');
  const desc = document.getElementById('foodDescText');

  spinTimer = setInterval(() => {
    slot.textContent = foodList[Math.floor(Math.random() * foodList.length)].emoji;
    tick++;
    if (tick >= 22) {
      stopSpin();
      slot.classList.remove('rolling');
      const pick = foodList[Math.floor(Math.random() * foodList.length)];
      slot.textContent = pick.emoji;
      result.textContent = '🎯 ' + pick.name;
      desc.textContent = pick.desc;
      spinning = false;
      burstPetals(10);
    }
  }, 75);
});

// PET SHOP
// ──────────────────────────────────
const pets = [
  { emoji:'🦔', name:'小刺刺 · 非洲迷你刺猬', desc:'虽然浑身是刺，但肚子超软！戳戳它会缩成小球～' },
  { emoji:'🦎', name:'小鳞鳞 · 豹纹守宫', desc:'眼睛大大，笑起来像天使。喜欢趴在温暖的手心里～' },
  { emoji:'🐍', name:'小卷卷 · 玉米蛇', desc:'滑溜溜凉丝丝，其实超温顺！缠在手上像活的项链～' },
  { emoji:'🦜', name:'小彩彩 · 玄凤鹦鹉', desc:'头顶一撮呆毛，开心时会吹口哨。最喜欢被摸摸头～' },
  { emoji:'🐇', name:'小绒绒 · 安哥拉兔', desc:'毛茸茸一团云朵！耳朵长长，鼻子一耸一耸超治愈～' },
  { emoji:'🐹', name:'小圆圆 · 仓鼠', desc:'腮帮子塞满食物最治愈了！跑轮小能手，停不下来～' },
  { emoji:'🦋', name:'小翅膀 · 大蓝闪蝶', desc:'翅膀闪着蓝色磷光，停在指尖时，时间都慢了～' },
  { emoji:'🐠', name:'小泡泡 · 泰国斗鱼', desc:'鳍像丝绸一样飘舞，看它游泳就能发呆好久好久～' }
];
let petIdx = 0;

function initPet() { petIdx = 0; renderPet(); }
function renderPet() {
  const p = pets[petIdx];
  document.getElementById('petEmoji').textContent = p.emoji;
  document.getElementById('petNameLabel').textContent = p.name;
  document.getElementById('petDescLabel').textContent = p.desc;
}

function boopPet() {
  const el = document.getElementById('petEmoji');
  const heart = document.getElementById('heartPop');
  el.classList.remove('bounce');
  void el.offsetWidth;
  el.classList.add('bounce');
  heart.classList.remove('fly');
  void heart.offsetWidth;
  heart.classList.add('fly');
  burstPetals(5);
}

document.getElementById('petStage').addEventListener('click', boopPet);
document.getElementById('prevPet').addEventListener('click', function(e) {
  e.stopPropagation(); petIdx = (petIdx - 1 + pets.length) % pets.length; renderPet(); burstPetals(3);
});
document.getElementById('nextPet').addEventListener('click', function(e) {
  e.stopPropagation(); petIdx = (petIdx + 1) % pets.length; renderPet(); burstPetals(3);
});

// FORTUNE — petal plucking
// ──────────────────────────────────
const fortunes = [
  '今天会有意想不到的好事发生 💫',
  '你笑起来的样子最好看，多笑笑吧～',
  '有一份礼物正在路上向你赶来 🎁',
  '你重视的人，同样也在重视着你 💜',
  '偶尔放空自己，也是一种重要的能力',
  '你已经做得很好了，不用给自己太大压力',
  '今天适合给自己买一个小礼物 🛍️',
  '想吃的东西就去吃，想去的地方就去吧！',
  '你的努力有人看在眼里，别着急 🌟',
  '今晚的月色会很美，记得抬头看看 🌙',
  '明天醒来，一切都会比今天更好一点',
  '你是被爱着的，永远不要怀疑这一点 💝',
  '有时候慢慢来，反而比较快 🌿',
  '今天可能会收到一条让你开心的消息 💌',
  '相信直觉，它会带你去对的地方 🧭'
];
let usedFortunes = [], fortuneOn = false;

function initFortune() {
  usedFortunes = []; fortuneOn = true;
  document.getElementById('fortuneResult').textContent = '';
  document.getElementById('fortuneResult').classList.remove('show');
  document.getElementById('fortuneHint').textContent = '👆 点一下鸢尾花，摘一片花瓣';
  document.getElementById('fortuneHint').style.opacity = '1';
  buildPetals();
}

function buildPetals() {
  const layer = document.getElementById('fortunePetalLayer');
  layer.innerHTML = '';
  const emojis = ['💜','🪻','🌸','💮'];
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('span');
    el.className = 'fp';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = (i / 8) * 360 * Math.PI / 180;
    const dist = 48 + Math.random() * 28;
    el.style.left = (75 + Math.cos(angle) * dist - 11) + 'px';
    el.style.top = (75 + Math.sin(angle) * dist - 11) + 'px';
    layer.appendChild(el);
  }
}

document.getElementById('fortuneFlowerArea').addEventListener('click', function() {
  if (!fortuneOn || currentScreen !== 'fortune') return;

  const petals = document.querySelectorAll('.fp');
  const alive = Array.from(petals).filter(p => !p.classList.contains('blown'));

  if (alive.length === 0) {
    document.getElementById('fortuneResult').textContent = '';
    document.getElementById('fortuneResult').classList.remove('show');
    document.getElementById('fortuneHint').textContent = '👆 再摘一轮花瓣吧～';
    document.getElementById('fortuneHint').style.opacity = '1';
    usedFortunes = [];
    buildPetals();
    return;
  }

  const pick = alive[Math.floor(Math.random() * alive.length)];
  const a = Math.random() * Math.PI * 2;
  const d = 60 + Math.random() * 70;
  pick.style.setProperty('--fx', Math.cos(a) * d + 'px');
  pick.style.setProperty('--fy', Math.sin(a) * d - 30 + 'px');
  pick.style.setProperty('--fr', (Math.random() - 0.5) * 360 + 'deg');
  pick.classList.add('blown');

  let avail = fortunes.filter((_, i) => !usedFortunes.includes(i));
  if (!avail.length) { usedFortunes = []; avail = fortunes; }
  const msg = avail[Math.floor(Math.random() * avail.length)];
  usedFortunes.push(fortunes.indexOf(msg));

  document.getElementById('fortuneResult').textContent = '🔮 ' + msg;
  document.getElementById('fortuneResult').classList.add('show');

  const still = Array.from(petals).filter(p => !p.classList.contains('blown'));
  document.getElementById('fortuneHint').textContent = still.length <= 1
    ? '👆 再点一下开启新一轮'
    : '👆 再摘一片花瓣';

  burstPetals(5);
});

  clearBreatheTimer();
  stopSpin();
  templeOn = false; breatheOn = false; spinning = false; fortuneOn = false;
}

document.addEventListener('dblclick', function(e) {
  if (e.target.closest('.option-card,button,.bell-area,.breathe-ring,.fortune-flower-area,.pet-stage,.pet-nav-dot,.spin-btn')) {
    e.preventDefault();
  }
}, { passive: false });
