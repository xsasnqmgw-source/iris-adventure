<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IRIS · 鸢尾花的奇遇</title>
<style>
:root {
  --iris-deep: #5B2D8E;
  --iris-mid: #8B5FBF;
  --iris-light: #B89BE0;
  --iris-soft: #DDCEF2;
  --iris-gold: #FAC53D;
  --iris-gold-bright: #FFE48A;
  --bg-start: #1A1032;
  --bg-mid: #150C2A;
  --bg-end: #0E0820;
  --card-bg: rgba(30, 18, 55, 0.78);
  --card-border: rgba(140, 110, 200, 0.22);
  --text: #EDE5FF;
  --text-dim: #B8A8D8;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden; overflow-y: auto;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg-start);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased;
  -webkit-overflow-scrolling: touch;
}

#app {
  width: 100%; min-height: 100vh;
  position: relative; overflow: hidden;
}

/* Background canvas */
#bgCanvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

/* Screens */
.screen {
  position: absolute; top: 0; left: 0;
  width: 100%; min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
  transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0; pointer-events: none;
  padding: 24px 16px;
  padding-bottom: calc(24px + var(--safe-bottom));
}
.screen.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
.screen.exit-left  { opacity: 0; transform: translateX(-36px); }
.screen.exit-right { opacity: 0; transform: translateX(36px); }
.screen.enter-from-right { opacity: 0; transform: translateX(36px); }
.screen.enter-from-left  { opacity: 0; transform: translateX(-36px); }

/* ============ HOME ============ */
#homeScreen { gap: 4px; padding-top: 36px; }

/* Iris flower from real SVG */
.iris-stage {
  position: relative;
  width: 160px; height: 190px;
  margin-bottom: 0;
  animation: irisFloat 5s ease-in-out infinite;
}
.iris-stage svg, .iris-stage img {
  width: 100%; height: 100%;
  filter: drop-shadow(0 6px 20px rgba(100,60,180,0.4));
}
@keyframes irisFloat {
  0%,100% { transform: translateY(0) rotate(-1deg); }
  30%  { transform: translateY(-10px) rotate(1deg); }
  60%  { transform: translateY(-4px) rotate(-0.5deg); }
}

.home-title {
  font-size: 24px; font-weight: 700;
  color: var(--text);
  letter-spacing: 2px;
  text-shadow: 0 0 25px rgba(140,110,210,0.5);
  margin-top: 8px;
}
.home-subtitle {
  font-size: 14px; color: var(--text-dim);
  margin-bottom: 18px; letter-spacing: 1.5px;
  margin-top: 6px;
}

/* Cards */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%; max-width: 360px;
}
.option-card {
  position: relative;
  background: var(--card-bg);
  border: 1.5px solid var(--card-border);
  border-radius: 18px;
  padding: 16px 12px;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.option-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(155,120,220,0.15) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.35s;
}
.option-card:active {
  transform: scale(0.94);
  border-color: rgba(160,130,220,0.6);
  box-shadow: 0 0 30px rgba(100,60,180,0.4);
}
.option-card:active::before { opacity: 1; }
.option-card .card-icon {
  font-size: 34px; position: relative; z-index: 1;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));
}
.option-card .card-label {
  font-size: 13px; font-weight: 600;
  color: var(--text); position: relative; z-index: 1;
  text-align: center; line-height: 1.3;
}
.option-card.full-width { grid-column: 1 / -1; }

/* ============ SHARED GAME HEADER ============ */
.game-header {
  position: absolute; top: 16px; left: 12px; right: 12px;
  display: flex; justify-content: space-between;
  align-items: center; z-index: 20;
}
.back-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(30,18,55,0.75);
  border: 1px solid rgba(140,110,200,0.28);
  color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.back-btn:active { background: rgba(100,60,170,0.4); transform: scale(0.88); }
.game-title {
  font-size: 17px; font-weight: 700;
  color: var(--text);
  text-shadow: 0 0 16px rgba(140,110,210,0.4);
  text-align: center;
}

/* ============ TEMPLE ============ */
.temple-scene { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.temple-icon { font-size: 70px; filter: drop-shadow(0 6px 20px rgba(100,60,180,0.3)); }
.bell-zone { position: relative; width: 100px; height: 110px; cursor: pointer; }
.bell-zone .b-emoji { font-size: 64px; display: block; text-align: center; transition: transform 0.08s; }
.bell-zone .b-emoji.swung { animation: bellSw 0.7s ease-in-out; }
@keyframes bellSw {
  0%,100%{transform:rotate(0)} 12%{transform:rotate(-15deg)} 28%{transform:rotate(12deg)}
  44%{transform:rotate(-9deg)} 60%{transform:rotate(6deg)} 76%{transform:rotate(-3deg)} 90%{transform:rotate(2deg)}
}
.bell-zone .ripple { position: absolute; top: 28px; left: 18px; width: 64px; height: 64px;
  border-radius: 50%; border: 2px solid rgba(250,197,61,0.5); opacity: 0; pointer-events: none; }
.bell-zone .ripple.go { animation: ripExpand 1.2s ease-out forwards; }
@keyframes ripExpand { 0%{transform:scale(0.4);opacity:0.9} 100%{transform:scale(3);opacity:0} }
.hint { font-size: 13px; color: var(--iris-gold); animation: softBeat 2s ease-in-out infinite; }
@keyframes softBeat { 0%,100%{opacity:0.45} 50%{opacity:1} }
.worry-num { font-size: 13px; color: var(--text-dim); text-align: center; }
.worry-msg { font-size: 13px; color: var(--iris-soft); text-align: center; max-width: 280px; line-height: 1.8; min-height: 20px; transition: all 0.4s; }

/* ============ RECHARGE ============ */
.breathe-scene { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.breathe-ring {
  width: 170px; height: 170px; border-radius: 50%;
  position: relative; display: flex;
  align-items: center; justify-content: center; cursor: pointer;
}
.breathe-ring .r-bg {
  position: absolute; width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at center, rgba(120,80,200,0.25), rgba(90,60,160,0.06));
  border: 1.5px solid rgba(150,120,220,0.32);
  box-shadow: 0 0 40px rgba(100,60,170,0.22);
}
.breathe-ring .r-icon {
  font-size: 52px; z-index: 1;
  transition: transform 0.6s ease, font-size 0.6s ease;
}
.breathe-label { font-size: 16px; color: var(--text); font-weight: 600; text-align: center; transition: all 0.4s; }
.breathe-sub  { font-size: 12px; color: var(--text-dim); text-align: center; }
.charge-track { width: 200px; height: 6px; background: rgba(150,120,220,0.16); border-radius: 3px; overflow: hidden; }
.charge-fill  { height: 100%; background: linear-gradient(90deg, var(--iris-mid), var(--iris-gold)); border-radius: 3px; transition: width 0.4s ease; width: 0%; }

/* ============ FOOD ============ */
.food-scene { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.food-slot {
  width: 180px; height: 180px;
  background: var(--card-bg); border-radius: 22px;
  border: 1.5px solid rgba(150,120,220,0.28);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.food-slot .s-emoji { font-size: 72px; transition: transform 0.08s; }
.food-slot .s-emoji.roll { animation: slotRoll 0.08s linear infinite; }
@keyframes slotRoll {
  0%{transform:translateY(0)} 25%{transform:translateY(-8px)}
  50%{transform:translateY(0)} 75%{transform:translateY(8px)} 100%{transform:translateY(0)}
}
.spin-btn {
  padding: 12px 36px;
  background: linear-gradient(135deg, var(--iris-mid), var(--iris-deep));
  border: none; border-radius: 28px;
  color: #fff; font-size: 15px; font-weight: 700;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 4px 18px rgba(100,60,170,0.4);
  transition: all 0.25s;
}
.spin-btn:active { transform: scale(0.92); }
.food-result { font-size: 15px; color: var(--iris-gold); text-align: center; font-weight: 600; min-height: 22px; transition: all 0.3s; }
.food-desc   { font-size: 12px; color: var(--text-dim); text-align: center; max-width: 280px; line-height: 1.6; }

/* ============ PET ============ */
.pet-scene { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.pet-stage {
  width: 150px; height: 150px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
}
.pet-stage .p-emoji {
  font-size: 90px;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 5px 14px rgba(0,0,0,0.28));
}
.pet-stage .p-emoji.bop { animation: petBop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes petBop {
  0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-26px) scale(1.1)}
  60%{transform:translateY(-8px) scale(0.94)} 80%{transform:translateY(-4px) scale(1.02)}
}
.pet-stage .hearts { position: absolute; pointer-events: none; font-size: 22px; opacity: 0; }
.pet-stage .hearts.pop { animation: heartUp 1.4s ease-out forwards; }
@keyframes heartUp {
  0%{opacity:1;transform:translateY(0) scale(0.4)} 40%{opacity:1;transform:translateY(-35px) scale(1.1)}
  100%{opacity:0;transform:translateY(-70px) scale(0.7)}
}
.pet-name  { font-size: 15px; color: var(--text); font-weight: 600; }
.pet-desc  { font-size: 12px; color: var(--text-dim); text-align: center; }
.pet-nav   { display: flex; gap: 18px; }
.pet-nav button {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(30,18,55,0.7);
  border: 1px solid rgba(140,110,200,0.28);
  color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.pet-nav button:active { background: rgba(100,60,170,0.4); }

/* ============ FORTUNE ============ */
.fortune-scene { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.fortune-area {
  position: relative; width: 150px; height: 150px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.fortune-area .f-core { font-size: 60px; transition: transform 0.3s; }
.fortune-petals { position: absolute; width: 100%; height: 100%; pointer-events: none; }
.fortune-petals .fp {
  position: absolute; font-size: 22px;
  opacity: 0.75; transition: all 0.55s ease-out;
}
.fortune-petals .fp.gone {
  opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(0);
}
.fortune-msg {
  font-size: 15px; color: var(--iris-gold);
  text-align: center; font-weight: 600;
  min-height: 50px; max-width: 280px;
  line-height: 1.6; transition: all 0.45s; opacity: 0;
}
.fortune-msg.shown { opacity: 1; }
.fortune-hint { font-size: 12px; color: var(--text-dim); animation: softBeat 2s ease-in-out infinite; }

/* ============ PETAL RAIN ============ */
.petal-drop {
  position: fixed; pointer-events: none; z-index: 999;
  animation: petalDrift linear forwards;
}
@keyframes petalDrift {
  0%  { opacity:0; transform:translateY(-30px) rotate(0deg) scale(0.35); }
  10% { opacity:0.85; transform:translateY(5vh) rotate(40deg) scale(1); }
  70% { opacity:0.35; }
  100%{ opacity:0; transform:translateY(105vh) translateX(var(--drift)) rotate(var(--spin)) scale(0.2); }
}

/* WeChat share tip */
.wx-tip {
  position: fixed; top: 10px; right: 14px; z-index: 1000;
  font-size: 12px; color: var(--text-dim);
  background: rgba(30,18,55,0.82); padding: 6px 12px;
  border-radius: 10px; pointer-events: none; opacity: 0;
  transition: opacity 0.35s;
}
.wx-tip.on { opacity: 1; }

/* Responsive */
@media (min-width: 420px) {
  .options-grid { max-width: 400px; gap: 12px; }
  .option-card { padding: 20px 16px; border-radius: 20px; }
  .option-card .card-icon { font-size: 38px; }
  .option-card .card-label { font-size: 14px; }
}
@media (min-width: 768px) {
  .options-grid { max-width: 480px; gap: 14px; }
  .option-card { padding: 26px 20px; }
  .option-card .card-icon { font-size: 44px; }
  .option-card .card-label { font-size: 16px; }
  .home-title { font-size: 30px; }
  .iris-stage { width: 190px; height: 220px; }
}
</style>
</head>
<body>

<div id="app">
  <canvas id="bgCanvas"></canvas>

  <!-- ===== HOME SCREEN ===== -->
  <div class="screen active" id="homeScreen">
    <!-- Real iris flower SVG from public domain -->
    <div class="iris-stage">
      <img src="iris-purple.svg" alt="鸢尾花">
    </div>

    <h1 class="home-title">IRIS · 鸢尾花的奇遇</h1>
    <p class="home-subtitle">今天，你想去哪里？</p>

    <div class="options-grid">
      <div class="option-card" data-screen="temple">
        <span class="card-icon">🏛️</span><span class="card-label">寺庙消灾</span>
      </div>
      <div class="option-card" data-screen="recharge">
        <span class="card-icon">🔋</span><span class="card-label">默默充电</span>
      </div>
      <div class="option-card" data-screen="food">
        <span class="card-icon">🍜</span><span class="card-label">大吃特吃</span>
      </div>
      <div class="option-card" data-screen="pet">
        <span class="card-icon">🦔</span><span class="card-label">异宠店</span>
      </div>
      <div class="option-card full-width" data-screen="fortune">
        <span class="card-icon">🌸</span><span class="card-label">备用方法 · 鸢尾占卜</span>
      </div>
    </div>
  </div>

  <!-- ===== TEMPLE SCREEN ===== -->
  <div class="screen" id="templeScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <span class="game-title">🏛️ 寺庙消灾</span><div style="width:38px"></div>
    </div>
    <div class="temple-scene">
      <div class="temple-icon">⛩️</div>
      <div class="bell-zone" id="bellZone">
        <span class="b-emoji" id="bellEmoji">🔔</span>
        <div class="ripple" id="rippleRing"></div>
      </div>
      <div class="hint">👆 敲响钟声，驱散烦恼</div>
      <div class="worry-num" id="worryNum">✨ 还有 <b>5</b> 个烦恼等待消散</div>
      <div class="worry-msg" id="worryMsg"></div>
    </div>
  </div>

  <!-- ===== RECHARGE SCREEN ===== -->
  <div class="screen" id="rechargeScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <span class="game-title">🔋 默默充电</span><div style="width:38px"></div>
    </div>
    <div class="breathe-scene">
      <div class="breathe-ring" id="breatheRing">
        <div class="r-bg"></div>
        <span class="r-icon" id="bloomIcon">🪷</span>
      </div>
      <div class="breathe-label" id="breatheLabel">准备好了吗？</div>
      <div class="breathe-sub" id="breatheSub">跟着鸢尾花的节奏呼吸</div>
      <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
    </div>
  </div>

  <!-- ===== FOOD SCREEN ===== -->
  <div class="screen" id="foodScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <span class="game-title">🍜 大吃特吃</span><div style="width:38px"></div>
    </div>
    <div class="food-scene">
      <div class="food-slot"><span class="s-emoji" id="slotEmoji">🍜</span></div>
      <button class="spin-btn" id="spinBtn">🎰 今天吃什么？</button>
      <div class="food-result" id="foodResult"></div>
      <div class="food-desc" id="foodDesc"></div>
    </div>
  </div>

  <!-- ===== PET SCREEN ===== -->
  <div class="screen" id="petScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <span class="game-title">🦔 异宠店</span><div style="width:38px"></div>
    </div>
    <div class="pet-scene">
      <div class="pet-stage" id="petStage">
        <span class="p-emoji" id="petEmoji">🦔</span>
        <span class="hearts" id="heartPop">💜</span>
      </div>
      <div class="pet-name" id="petName">小刺刺 · 非洲迷你刺猬</div>
      <div class="pet-desc" id="petDesc">戳戳我，我会很开心！</div>
      <div class="pet-nav">
        <button id="prevPet">◀</button>
        <button id="nextPet">▶</button>
      </div>
    </div>
  </div>

  <!-- ===== FORTUNE SCREEN ===== -->
  <div class="screen" id="fortuneScreen">
    <div class="game-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <span class="game-title">🌸 鸢尾占卜</span><div style="width:38px"></div>
    </div>
    <div class="fortune-scene">
      <div class="fortune-area" id="fortuneArea">
        <span class="f-core">🌸</span>
        <div class="fortune-petals" id="fortunePetals"></div>
      </div>
      <div class="fortune-hint" id="fortuneHint">👆 点一下鸢尾花，摘一片花瓣</div>
      <div class="fortune-msg" id="fortuneMsg"></div>
    </div>
  </div>
</div>

<script>
// ── BG PARTICLES ──
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const bgP = [];
class Petal {
  constructor(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : -20;
    this.w = Math.random() * 7 + 3;
    this.h = this.w * 2.2;
    this.vy = Math.random() * 0.35 + 0.12;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.rot = Math.random() * 360;
    this.vr = (Math.random() - 0.5) * 0.35;
    this.alpha = Math.random() * 0.32 + 0.06;
    this.purple = Math.random() < 0.6;
  }
  update() {
    this.y += this.vy; this.x += this.vx + Math.sin(this.y * 0.02) * 0.12;
    this.rot += this.vr;
    if (this.y > H + 30) { this.y = -20; this.x = Math.random() * W; }
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot * Math.PI / 180);
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.purple ? 'rgba(155,120,215,1)' : 'rgba(250,197,61,0.75)';
    ctx.beginPath(); ctx.ellipse(0, 0, this.w, this.h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
for (let i = 0; i < 40; i++) bgP.push(new Petal(true));
(function loop() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1A1032'); g.addColorStop(0.45, '#150C2A'); g.addColorStop(1, '#0E0820');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  bgP.forEach(p => { p.update(); p.draw(ctx); });
  requestAnimationFrame(loop);
})();

// ── SCREEN NAV ──
let currentScreen = 'home';
function showScreen(id, dir) {
  const oldEl = document.getElementById(currentScreen + 'Screen');
  const newEl = document.getElementById(id + 'Screen');
  if (!oldEl || !newEl || currentScreen === id) return;
  ['exit-left','exit-right','enter-from-right','enter-from-left'].forEach(c => {
    oldEl.classList.remove(c); newEl.classList.remove(c);
  });
  if (dir === 'forward') { oldEl.classList.add('exit-left'); newEl.classList.add('enter-from-right'); }
  else { oldEl.classList.add('exit-right'); newEl.classList.add('enter-from-left'); }
  oldEl.classList.remove('active'); newEl.classList.add('active');
  setTimeout(() => { oldEl.classList.remove('exit-left','exit-right'); newEl.classList.remove('enter-from-right','enter-from-left'); }, 450);
  currentScreen = id;
}
function goHome() { showScreen('home', 'back'); resetAll(); }

// ── PETAL BURST ──
function burst(n) {
  const emojis = ['💜','🌸','🪻','🔮','✨','💫','🍃'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span'); el.className = 'petal-drop';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (Math.random() * 80 + 8) + '%';
    el.style.top = -(Math.random() * 50 + 10) + 'px';
    el.style.animationDuration = (Math.random() * 2.5 + 3) + 's';
    el.style.setProperty('--drift', (Math.random() - 0.5) * 100 + 'px');
    el.style.setProperty('--spin', (Math.random() * 360) + 'deg');
    el.style.fontSize = (Math.random() * 14 + 14) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}

// ── CARD CLICK ──
document.querySelectorAll('.option-card').forEach(card => {
  card.addEventListener('click', function() {
    const screen = this.dataset.screen;
    burst(12); showScreen(screen, 'forward');
    if (screen === 'temple') initTemple();
    else if (screen === 'recharge') initRecharge();
    else if (screen === 'food') initFood();
    else if (screen === 'pet') initPet();
    else if (screen === 'fortune') initFortune();

});

// ── TEMPLE ──
const worries = ['工作上的一点小疲惫','深夜辗转反侧的失眠','莫名其妙涌上来的焦虑','和别人比较后的小失落','对未来的那一点点迷茫'];
let wi = 0, tOn = false;
function initTemple() { wi = 0; tOn = true;
  document.getElementById('worryNum').innerHTML = '✨ 还有 <b>' + worries.length + '</b> 个烦恼等待消散';
  document.getElementById('worryMsg').textContent = '深呼吸，准备好迎接平静了吗？';
}
document.getElementById('bellZone').addEventListener('click', function() {
  if (!tOn || currentScreen !== 'temple') return;
  const bell = document.getElementById('bellEmoji'), ripple = document.getElementById('rippleRing');
  const msg = document.getElementById('worryMsg'), num = document.getElementById('worryNum');
  bell.classList.remove('swung'); void bell.offsetWidth; bell.classList.add('swung');
  ripple.classList.remove('go'); void ripple.offsetWidth; ripple.classList.add('go');
  burst(8);

    msg.textContent = '「' + worries[wi] + '」—— 被钟声带走了 ✨'; wi++;

    if (rem > 0) num.innerHTML = '✨ 还有 <b>' + rem + '</b> 个烦恼等待消散';
    else { num.innerHTML = '🎉 <b>全部消散！</b>'; msg.textContent = '所有烦恼都随鸢尾花瓣飘走了～\nIRIS，你是最棒的！💜'; tOn = false; setTimeout(() => burst(25), 350); }

});

// ── RECHARGE ──
let phase = 0, cycles = 0, bOn = false, bt = null;
const pm = {
  0:{l:'准备好了吗？',s:'跟着鸢尾花的节奏呼吸',sc:1,ic:'🪷'},
  1:{l:'吸气……',s:'慢慢吸 ~ 4 秒',sc:1.55,ic:'🌸'},
  2:{l:'屏住呼吸',s:'保持住 ~ 7 秒',sc:1.55,ic:'🌺'},
  3:{l:'呼气……',s:'缓缓呼 ~ 8 秒',sc:1,ic:'🪷'}
};
function initRecharge() { clearBt(); phase=0; cycles=0; bOn=true; applyPhase(); document.getElementById('chargeFill').style.width='0%'; }
function clearBt() { if(bt){clearTimeout(bt);bt=null;} }
function applyPhase() {
  const p=pm[phase];
  document.getElementById('breatheLabel').textContent=p.l;
  document.getElementById('breatheSub').textContent=p.s;
  const icon=document.getElementById('bloomIcon');
  icon.textContent=p.ic; icon.style.transform='scale('+p.sc+')'; icon.style.fontSize=(52*p.sc)+'px';
}
function runCycle() {
  if(!bOn||currentScreen!=='recharge')return;
  switch(phase){
    case 0: phase=1;applyPhase();burst(4);bt=setTimeout(runCycle,4000);break;
    case 1: phase=2;applyPhase();bt=setTimeout(runCycle,7000);break;
    case 2: phase=3;applyPhase();bt=setTimeout(runCycle,8000);break;
    case 3: cycles++; document.getElementById('chargeFill').style.width=Math.min(cycles*25,100)+'%';
      if(cycles>=4){document.getElementById('breatheLabel').textContent='🔋 充满电了！';document.getElementById('breatheSub').textContent='IRIS，你现在能量满满 ✨';
        const icon=document.getElementById('bloomIcon');icon.textContent='🌷';icon.style.transform='scale(1.65)';icon.style.fontSize='72px';bOn=false;burst(20);return;}
      phase=1;applyPhase();burst(3);bt=setTimeout(runCycle,4000);break;
  }
}
document.getElementById('breatheRing').addEventListener('click',function(){if(!bOn){initRecharge();setTimeout(()=>runCycle(),500);return;}if(phase===0)runCycle();});

function stopSpin() { if(spinT){clearInterval(spinT);spinT=null;} }

  if(spinOn||currentScreen!=='food')return; spinOn=true;

let uf=[], fOn=false;
function initFortune(){uf=[];fOn=true;document.getElementById('fortuneMsg').textContent='';document.getElementById('fortuneMsg').classList.remove('shown');document.getElementById('fortuneHint').textContent='👆 点一下鸢尾花，摘一片花瓣';document.getElementById('fortuneHint').style.opacity='1';buildP();}
function buildP(){
  const l=document.getElementById('fortunePetals');l.innerHTML='';
  const em=['💜','🪻','🌸','💮'];
  for(let i=0;i<8;i++){const el=document.createElement('span');el.className='fp';el.textContent=em[Math.floor(Math.random()*em.length)];const a=(i/8)*360*Math.PI/180;const d=48+Math.random()*28;el.style.left=(75+Math.cos(a)*d-11)+'px';el.style.top=(75+Math.sin(a)*d-11)+'px';l.appendChild(el);}
}
document.getElementById('fortuneArea').addEventListener('click',function(){
  if(!fOn||currentScreen!=='fortune')return;
  const ps=document.querySelectorAll('.fp'),alive=Array.from(ps).filter(p=>!p.classList.contains('gone'));
  if(!alive.length){document.getElementById('fortuneMsg').textContent='';document.getElementById('fortuneMsg').classList.remove('shown');document.getElementById('fortuneHint').textContent='👆 再摘一轮花瓣吧～';document.getElementById('fortuneHint').style.opacity='1';uf=[];buildP();return;}
  const pick=alive[Math.floor(Math.random()*alive.length)],a=Math.random()*Math.PI*2,d=60+Math.random()*70;
  pick.style.setProperty('--fx',Math.cos(a)*d+'px');pick.style.setProperty('--fy',Math.sin(a)*d-30+'px');pick.style.setProperty('--fr',(Math.random()-0.5)*360+'deg');pick.classList.add('gone');
  let av=fortunes.filter((_,i)=>!uf.includes(i));if(!av.length){uf=[];av=fortunes;}
  const msg=av[Math.floor(Math.random()*av.length)];uf.push(fortunes.indexOf(msg));
  document.getElementById('fortuneMsg').textContent='🔮 '+msg;document.getElementById('fortuneMsg').classList.add('shown');
  const st=Array.from(ps).filter(p=>!p.classList.contains('gone'));
  document.getElementById('fortuneHint').textContent=st.length<=1?'👆 再点一下开启新一轮':'👆 再摘一片花瓣';
  burst(5);
});
