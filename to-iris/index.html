<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 IRIS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1035 0%, #0d0820 55%, #060412 100%);
    color: #f0e8ff; min-height: 100vh;
    overflow: hidden;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position:fixed; top:0; left:0; right:0; bottom:0;
    display:block; pointer-events:none; z-index:0;
  }

  .stage {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    padding: 24px;
  }

  .signature {
    position: absolute; top: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 12px; letter-spacing: 6px; color: #b8a8e8;
    opacity: 0; transition: opacity 1s;
  }
  .signature.show { opacity: .8; }

  .title {
    font-size: 22px; font-weight: 500; letter-spacing: 3px;
    color: #e8d8ff; text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    -webkit-transform: translateY(0);
    transform: translateY(0);
    transition: opacity .5s, transform .5s;
  }
  .title.show { opacity: 1; }
  .title.hide { opacity: 0; -webkit-transform: translateY(-20px); transform: translateY(-20px); }

  .signature {
    transition: opacity .5s, transform .5s;
  }
  .signature.hide { opacity: 0 !important; -webkit-transform: translateY(-10px); transform: translateY(-10px); }

  .welcome {
    font-size: 14px; color: #c8a8d8; text-align: center;
    margin-bottom: 16px; letter-spacing: 1px;
    opacity: 0; transition: opacity .8s .5s;
    font-family: "PingFang SC", sans-serif;
    height: 42px;
  }
  .welcome.show { opacity: .85; }
  .welcome.hide { opacity: 0; -webkit-transform: translateY(-10px); transform: translateY(-10px); }
  .welcome .line2 { font-size: 11px; color: #8a7a9a; margin-top: 4px; display: block; }

  .flower-wrap {
    position: relative; width: 240px; height: 240px;
    margin-bottom: 28px;
    opacity: 0; -webkit-transform: scale(0.6); transform: scale(0.6);
    transition: opacity 1.5s .3s, transform 1.5s .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .flower-wrap.show { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }

  .flower {
    position: absolute; top:0; left:0; width:100%; height:100%;
    cursor: pointer;
    z-index: 5;
  }

  /* 中心坐标系：所有花瓣 transform-origin 都在花朵中心 */
  .lotus {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;  /* 0 尺寸的容器，仅作为旋转参考点 */
  }

  /* 花瓣公转环：外层和中层各自独立旋转，角速度不同 */
  .petal-ring {
    position: absolute; top: 0; left: 0;
    width: 0; height: 0;
    -webkit-transform-style: preserve-3d;
    transform-style: preserve-3d;
  }
  /* 外层：30秒一圈，逆时针，慢 */
  .outer-ring {
    -webkit-animation: orbitOuter 30s linear infinite;
    animation: orbitOuter 30s linear infinite;
  }
  /* 中层：18秒一圈，逆时针，快 */
  .mid-ring {
    -webkit-animation: orbitMid 18s linear infinite;
    animation: orbitMid 18s linear infinite;
  }
  @-webkit-keyframes orbitOuter { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(-360deg); } }
  @keyframes orbitOuter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @-webkit-keyframes orbitMid { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(-360deg); } }
  @keyframes orbitMid { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

  /* 花瓣：椭圆形，初始贴合中心，旋转出去 */
  .petal {
    position: absolute;
    left: -32px; top: -85px;  /* 中心点对齐莲花中心；椭圆向上 */
    width: 64px; height: 85px;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    -webkit-transform-origin: 32px 85px;  /* 椭圆底部中心 = 花朵中心 */
    transform-origin: 32px 85px;
    opacity: 0;
    box-shadow: inset -6px -6px 14px rgba(190,120,180,0.3),
                inset 4px 4px 10px rgba(255,255,255,0.4);
  }

  /* 外层大花瓣：12片，粉白色 */
  .petal.outer {
    background: linear-gradient(180deg,
      rgba(255,250,253,0.98) 0%,
      rgba(255,225,238,0.95) 35%,
      rgba(240,170,210,0.9) 75%,
      rgba(210,130,190,0.85) 100%);
  }
  .petal.outer.p1  { -webkit-animation: bloomP1  2.4s cubic-bezier(.25,.46,.45,.94) .10s forwards; animation: bloomP1  2.4s cubic-bezier(.25,.46,.45,.94) .10s forwards; }
  .petal.outer.p2  { -webkit-animation: bloomP2  2.4s cubic-bezier(.25,.46,.45,.94) .18s forwards; animation: bloomP2  2.4s cubic-bezier(.25,.46,.45,.94) .18s forwards; }
  .petal.outer.p3  { -webkit-animation: bloomP3  2.4s cubic-bezier(.25,.46,.45,.94) .26s forwards; animation: bloomP3  2.4s cubic-bezier(.25,.46,.45,.94) .26s forwards; }
  .petal.outer.p4  { -webkit-animation: bloomP4  2.4s cubic-bezier(.25,.46,.45,.94) .34s forwards; animation: bloomP4  2.4s cubic-bezier(.25,.46,.45,.94) .34s forwards; }
  .petal.outer.p5  { -webkit-animation: bloomP5  2.4s cubic-bezier(.25,.46,.45,.94) .42s forwards; animation: bloomP5  2.4s cubic-bezier(.25,.46,.45,.94) .42s forwards; }
  .petal.outer.p6  { -webkit-animation: bloomP6  2.4s cubic-bezier(.25,.46,.45,.94) .50s forwards; animation: bloomP6  2.4s cubic-bezier(.25,.46,.45,.94) .50s forwards; }
  .petal.outer.p7  { -webkit-animation: bloomP7  2.4s cubic-bezier(.25,.46,.45,.94) .58s forwards; animation: bloomP7  2.4s cubic-bezier(.25,.46,.45,.94) .58s forwards; }
  .petal.outer.p8  { -webkit-animation: bloomP8  2.4s cubic-bezier(.25,.46,.45,.94) .66s forwards; animation: bloomP8  2.4s cubic-bezier(.25,.46,.45,.94) .66s forwards; }
  .petal.outer.p9  { -webkit-animation: bloomP9  2.4s cubic-bezier(.25,.46,.45,.94) .74s forwards; animation: bloomP9  2.4s cubic-bezier(.25,.46,.45,.94) .74s forwards; }
  .petal.outer.p10 { -webkit-animation: bloomP10 2.4s cubic-bezier(.25,.46,.45,.94) .82s forwards; animation: bloomP10 2.4s cubic-bezier(.25,.46,.45,.94) .82s forwards; }
  .petal.outer.p11 { -webkit-animation: bloomP11 2.4s cubic-bezier(.25,.46,.45,.94) .90s forwards; animation: bloomP11 2.4s cubic-bezier(.25,.46,.45,.94) .90s forwards; }
  .petal.outer.p12 { -webkit-animation: bloomP12 2.4s cubic-bezier(.25,.46,.45,.94) .98s forwards; animation: bloomP12 2.4s cubic-bezier(.25,.46,.45,.94) .98s forwards; }

  /* 中层花瓣：8片，紫色，位置错开 */
  .petal.mid {
    width: 50px; height: 65px;
    left: -25px; top: -65px;
    -webkit-transform-origin: 25px 65px;
    transform-origin: 25px 65px;
    background: linear-gradient(180deg,
      rgba(248,235,255,0.95) 0%,
      rgba(220,180,240,0.9) 50%,
      rgba(170,120,210,0.85) 100%);
    box-shadow: inset -4px -4px 10px rgba(150,90,180,0.3),
                inset 3px 3px 8px rgba(255,255,255,0.4);
  }
  .petal.mid.m1 { -webkit-animation: bloomM1 2.2s cubic-bezier(.25,.46,.45,.94) .55s forwards; animation: bloomM1 2.2s cubic-bezier(.25,.46,.45,.94) .55s forwards; }
  .petal.mid.m2 { -webkit-animation: bloomM2 2.2s cubic-bezier(.25,.46,.45,.94) .65s forwards; animation: bloomM2 2.2s cubic-bezier(.25,.46,.45,.94) .65s forwards; }
  .petal.mid.m3 { -webkit-animation: bloomM3 2.2s cubic-bezier(.25,.46,.45,.94) .75s forwards; animation: bloomM3 2.2s cubic-bezier(.25,.46,.45,.94) .75s forwards; }
  .petal.mid.m4 { -webkit-animation: bloomM4 2.2s cubic-bezier(.25,.46,.45,.94) .85s forwards; animation: bloomM4 2.2s cubic-bezier(.25,.46,.45,.94) .85s forwards; }
  .petal.mid.m5 { -webkit-animation: bloomM5 2.2s cubic-bezier(.25,.46,.45,.94) .95s forwards; animation: bloomM5 2.2s cubic-bezier(.25,.46,.45,.94) .95s forwards; }
  .petal.mid.m6 { -webkit-animation: bloomM6 2.2s cubic-bezier(.25,.46,.45,.94) 1.05s forwards; animation: bloomM6 2.2s cubic-bezier(.25,.46,.45,.94) 1.05s forwards; }
  .petal.mid.m7 { -webkit-animation: bloomM7 2.2s cubic-bezier(.25,.46,.45,.94) 1.15s forwards; animation: bloomM7 2.2s cubic-bezier(.25,.46,.45,.94) 1.15s forwards; }
  .petal.mid.m8 { -webkit-animation: bloomM8 2.2s cubic-bezier(.25,.46,.45,.94) 1.25s forwards; animation: bloomM8 2.2s cubic-bezier(.25,.46,.45,.94) 1.25s forwards; }

  /* 花心 */
  .core {
    position: absolute; top: 50%; left: 50%;
    width: 40px; height: 40px;
    margin-top: -20px; margin-left: -20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8e0 0%, #ffd888 45%, #e8a850 100%);
    box-shadow: 0 0 18px rgba(255,200,120,0.55), inset 0 0 10px rgba(255,255,255,0.5);
    opacity: 0;
    -webkit-transform: scale(0);
    transform: scale(0);
    -webkit-animation: coreBloom 1.4s cubic-bezier(.34,1.56,.64,1) 1.2s forwards;
    animation: coreBloom 1.4s cubic-bezier(.34,1.56,.64,1) 1.2s forwards;
    z-index: 6;
  }
  .core::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,160,0.4) 0%, transparent 70%);
    -webkit-animation: coreGlow 3s ease-in-out infinite;
    animation: coreGlow 3s ease-in-out infinite;
  }

  /* 花粉点：装饰在花心上 */
  .pollen {
    position: absolute; top: 50%; left: 50%;
    width: 3px; height: 3px;
    margin-top: -1.5px; margin-left: -1.5px;
    border-radius: 50%; background: #c87028;
    z-index: 7;
    opacity: 0;
    -webkit-animation: pollenShow .8s ease-out 1.8s forwards;
    animation: pollenShow .8s ease-out 1.8s forwards;
  }

  /* 外层花瓣关键帧：从 0deg 旋转展开到自己的扇区 */
  @-webkit-keyframes bloomP1  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(0deg) scale(1); opacity: .9; } }
  @keyframes bloomP1  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(0deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP2  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(30deg) scale(1); opacity: .9; } }
  @keyframes bloomP2  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(30deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP3  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(60deg) scale(1); opacity: .9; } }
  @keyframes bloomP3  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(60deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP4  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(90deg) scale(1); opacity: .9; } }
  @keyframes bloomP4  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(90deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP5  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(120deg) scale(1); opacity: .9; } }
  @keyframes bloomP5  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(120deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP6  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(150deg) scale(1); opacity: .9; } }
  @keyframes bloomP6  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(150deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP7  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(180deg) scale(1); opacity: .9; } }
  @keyframes bloomP7  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(180deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP8  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(210deg) scale(1); opacity: .9; } }
  @keyframes bloomP8  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(210deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP9  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(240deg) scale(1); opacity: .9; } }
  @keyframes bloomP9  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(240deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP10 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(270deg) scale(1); opacity: .9; } }
  @keyframes bloomP10 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(270deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP11 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(300deg) scale(1); opacity: .9; } }
  @keyframes bloomP11 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(300deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP12 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(330deg) scale(1); opacity: .9; } }
  @keyframes bloomP12 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(330deg) scale(1); opacity: .9; } }

  /* 中层：错开 22.5° */
  @-webkit-keyframes bloomM1 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(22.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM1 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(22.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM2 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(67.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM2 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(67.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM3 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(112.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM3 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(112.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM4 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(157.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM4 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(157.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM5 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(202.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM5 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(202.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM6 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(247.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM6 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(247.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM7 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(292.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM7 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(292.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM8 { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(337.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM8 { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(337.5deg) scale(1); opacity: .92; } }

  @-webkit-keyframes coreBloom {
    0% { -webkit-transform: scale(0); opacity: 0; }
    70% { -webkit-transform: scale(1.2); opacity: 1; }
    100% { -webkit-transform: scale(1); opacity: 1; }
  }
  @keyframes coreBloom {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @-webkit-keyframes coreGlow {
    0%,100% { -webkit-transform: scale(1); opacity: .65; }
    50% { -webkit-transform: scale(1.3); opacity: .3; }
  }
  @keyframes coreGlow {
    0%,100% { transform: scale(1); opacity: .65; }
    50% { transform: scale(1.3); opacity: .3; }
  }
  @-webkit-keyframes pollenShow {
    0% { opacity: 0; -webkit-transform: scale(0); }
    100% { opacity: 1; -webkit-transform: scale(1); }
  }
  @keyframes pollenShow {
    0% { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  .flower.popped {
    -webkit-animation: flowerPop .55s cubic-bezier(.2,.9,.3,1.2) forwards;
    animation: flowerPop .55s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @-webkit-keyframes flowerPop {
    0% { -webkit-transform: scale(1); opacity: 1; }
    40% { -webkit-transform: scale(1.2); opacity: .9; }
    100% { -webkit-transform: scale(0); opacity: 0; }
  }
  @keyframes flowerPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.2); opacity: .9; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* 花瓣爆开：每片花瓣朝外旋转飞散 */
  .petal.scatter-1  { -webkit-animation: scatter1  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter1  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-2  { -webkit-animation: scatter2  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter2  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-3  { -webkit-animation: scatter3  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter3  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-4  { -webkit-animation: scatter4  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter4  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-5  { -webkit-animation: scatter5  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter5  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-6  { -webkit-animation: scatter6  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter6  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-7  { -webkit-animation: scatter7  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter7  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-8  { -webkit-animation: scatter8  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter8  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-9  { -webkit-animation: scatter9  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter9  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-10 { -webkit-animation: scatter10 .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter10 .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-11 { -webkit-animation: scatter11 .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter11 .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-12 { -webkit-animation: scatter12 .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter12 .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  /* 8个中层花瓣 */
  .petal.scatter-13 { -webkit-animation: scatter13 .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter13 .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-14 { -webkit-animation: scatter14 .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter14 .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-15 { -webkit-animation: scatter15 .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter15 .9s cubic-bezier(.25,.7,.4,1) forwards !important; }

    color: #d8a860;
  }

  /* 顶部指引 */
  .orbit-tip {
    text-align: center; color: #b8a8d8;
    font-size: 12px; letter-spacing: 4px;
    font-family: "PingFang SC", sans-serif;
    margin-bottom: 20px;
    opacity: 0;
    -webkit-animation: tipIn .6s ease-out forwards;
    animation: tipIn .6s ease-out forwards;
  }
  @-webkit-keyframes tipIn { to { opacity: 0.8; } }
  @keyframes tipIn { to { opacity: 0.8; } }

  .orbit-cta {
    text-align: center; color: #8a7aa8;
    font-size: 11px; letter-spacing: 2px;
    font-family: "PingFang SC", sans-serif;
    margin-top: 16px;
    opacity: 0;
    -webkit-animation: tipIn .6s ease-out .4s forwards;
    animation: tipIn .6s ease-out .4s forwards;
  }

  /* 选中飞出动画 */
  .orbit-card.selected {
    z-index: 10;
    pointer-events: none;
  }
  .orbit-card.faded {
    opacity: 0 !important;
    pointer-events: none;
    -webkit-transform: scale(0.5) !important;
    transform: scale(0.5) !important;
  }

  /* 卡片入场前的遮罩（黑屏过渡） */
  .flash {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,220,240,0.95) 50%, rgba(120,80,180,0.9) 100%);
    z-index: 200;
    pointer-events: none;
    opacity: 0;
  }
  .flash.go {
    -webkit-animation: flashAnim 1s ease-out forwards;
    animation: flashAnim 1s ease-out forwards;
  }
  @-webkit-keyframes flashAnim {
    0%   { opacity: 0; -webkit-transform: scale(0.3); }
    25%  { opacity: 1; -webkit-transform: scale(1.3); }
    55%  { opacity: .95; -webkit-transform: scale(2.2); }
    100% { opacity: 0; -webkit-transform: scale(4.5); }
  }
  @keyframes flashAnim {
    0%   { opacity: 0; transform: scale(0.3); }
    25%  { opacity: 1; transform: scale(1.3); }
    55%  { opacity: .95; transform: scale(2.2); }
    100% { opacity: 0; transform: scale(4.5); }
  }

  /* 光环冲击波 */
  .shockwave {
    position: fixed;
    top: 50%; left: 50%;
    width: 100px; height: 100px;
    margin: -50px 0 0 -50px;
    border: 2px solid rgba(255,200,240,.85);
    border-radius: 50%;
    pointer-events: none;
    z-index: 199;
    -webkit-animation: shockwaveAnim .9s ease-out forwards;
    animation: shockwaveAnim .9s ease-out forwards;
  }
  .shockwave.sw-2 {
    border-color: rgba(216,180,255,.7);
    -webkit-animation-delay: .12s;
    animation-delay: .12s;
  }
  .shockwave.sw-3 {
    border-color: rgba(255,220,180,.6);
    -webkit-animation-delay: .24s;
    animation-delay: .24s;
  }
  @-webkit-keyframes shockwaveAnim {
    0%   { -webkit-transform: scale(0); opacity: 1; }
    100% { -webkit-transform: scale(8); opacity: 0; }
  }
  @keyframes shockwaveAnim {
    0%   { transform: scale(0); opacity: 1; }
    100% { transform: scale(8); opacity: 0; }
  }

  /* 屏幕震动 */
  .shake { -webkit-animation: shakeAnim .35s ease-out; animation: shakeAnim .35s ease-out; }
  @-webkit-keyframes shakeAnim {
    0%, 100% { -webkit-transform: translate(0,0); }
    20% { -webkit-transform: translate(-4px, 3px); }
    40% { -webkit-transform: translate(5px, -2px); }
    60% { -webkit-transform: translate(-3px, -4px); }
    80% { -webkit-transform: translate(2px, 3px); }
  }
  @keyframes shakeAnim {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-4px, 3px); }
    40% { transform: translate(5px, -2px); }
    60% { transform: translate(-3px, -4px); }
    80% { transform: translate(2px, 3px); }
  }

  /* 卡片辐射光线 */
  .ray {
    position: absolute; top: 50%; left: 50%;
    width: 2px; height: 80px;
    margin: -40px 0 0 -1px;
    background: linear-gradient(180deg, transparent, #fff, transparent);

    pointer-events: none;
    -webkit-animation: rayShot .7s ease-out forwards;

  }
  @-webkit-keyframes rayShot {
    0%   { opacity: 1; -webkit-transform: rotate(var(--ang, 0deg)) translateY(-30px) scaleY(.3); }
    100% { opacity: 0; -webkit-transform: rotate(var(--ang, 0deg)) translateY(-180px) scaleY(1.4); }
  }

    100% { opacity: 0; transform: rotate(var(--ang, 0deg)) translateY(-180px) scaleY(1.4); }

</style>

<script>

/* ===== 星空 ===== */
var canvas = document.getElementById('stars');
var ctx = canvas.getContext('2d');
var W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

var stars = [];
for (var i=0; i<150; i++){
  stars.push({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6 + 0.2,
    vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08,
    a: Math.random()*0.6 + 0.2,
    tw: Math.random()*Math.PI*2,
    tws: 0.02 + Math.random()*0.03
  });
}
var meteors = [];

function tick(){
  ctx.clearRect(0,0,W,H);
  for (var i=0; i<stars.length; i++){
    var s = stars[i];
    s.x += s.vx; s.y += s.vy;
    if (s.x<0) s.x=W; if (s.x>W) s.x=0;
    if (s.y<0) s.y=H; if (s.y>H) s.y=0;
    s.tw += s.tws;
    var alpha = s.a * (0.5 + 0.5*Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = alpha;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 流星
  if (Math.random() < 0.006 && meteors.length < 3) {
    meteors.push({
      x: Math.random()*W*0.6, y: Math.random()*H*0.3,
      vx: 6 + Math.random()*4, vy: 3 + Math.random()*2,
      len: 80 + Math.random()*60, a: 1
    });
  }
  for (var j = meteors.length - 1; j >= 0; j--) {
    var m = meteors[j];
    m.x += m.vx; m.y += m.vy; m.a -= 0.015;
    if (m.a <= 0 || m.x > W) { meteors.splice(j, 1); continue; }
    var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.len, m.y - m.len*0.5);
    grad.addColorStop(0, 'rgba(255,255,255,' + m.a + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.len, m.y - m.len*0.5);
    ctx.stroke();
  }
  requestAnimationFrame(tick);
}
tick();

/* ===== 入场动画 ===== */

/* ===== 记忆系统 (localStorage) ===== */
var STORAGE_KEY = 'iris_memory_v1';
var memory = loadMemory();

function loadMemory(){
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    var m = s ? JSON.parse(s) : {};
    return {
      collected: m.collected || {},
      totalFlips: m.totalFlips || 0,
      visitCount: m.visitCount || 0,
      lastVisitTime: m.lastVisitTime || 0,
      lastCardIdx: m.lastCardIdx || -1
    };
  } catch(e) {
    return { collected: {}, totalFlips: 0, visitCount: 0, lastVisitTime: 0, lastCardIdx: -1 };
  }
}

function saveMemory(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(memory)); } catch(e) {}
}

function markVisit(){
  memory.visitCount++;
  memory.lastVisitTime = Date.now();
  saveMemory();
}

function getWelcomeText(){
  var visits = memory.visitCount;
  if (visits === 1) return '初次见面，请多指教 ✨';
  if (visits === 2) return '又见面了，很高兴你还来 🌸';
  if (visits === 3) return '第三次了，你是不是喜欢上这里了？ 😊';
  if (visits === 5) return '五连打卡！我开始期待每天见到你了 🥰';
  if (visits === 10) return '十次了！你是我的常客了 🎉';
  if (visits > 10) return '第 ' + visits + ' 次相遇，谢谢你一直陪着我 💞';
  var msgs = ['好久不见，想我了吗？ 💫', '欢迎回来，今天想翻哪张？ 🌙', '又见面啦，今天天气真好 🍃', '等你好久了，点一下吧 ✨'];
  return msgs[(visits - 1) % msgs.length];
}

function getLastVisitText(){
  if (!memory.lastVisitTime) return '';
  var diff = Date.now() - memory.lastVisitTime;
  var hours = Math.floor(diff / (1000 * 60 * 60));
  var days = Math.floor(hours / 24);
  if (days > 0) return '上次见面是 ' + days + ' 天前';
  if (hours > 0) return '上次见面是 ' + hours + ' 小时前';
  if (Math.floor(diff / 60000) > 0) return '上次见面是几分钟前';
  return '刚见过面，这么快又来啦';
}

var collected = memory.collected;
var currentIdx = -1;
var count = memory.totalFlips;
var lastIdx = memory.lastCardIdx;

markVisit();

/* ===== 交互 ===== */
var flower = document.getElementById('flower');
var flowerWrap = document.getElementById('flowerWrap');

var busy = false;

function drawCard(idx){

/* 柔和光粒子：缓慢上升飘散 */
function softGlow(cx, cy){
  var colors = ['rgba(255,209,168,0.8)','rgba(232,168,216,0.8)','rgba(184,168,232,0.7)','rgba(168,216,255,0.6)','rgba(255,245,232,0.9)'];
  for (var i = 0; i < 24; i++) {
    (function(delay){
      setTimeout(function(){
        var ang = Math.random() * Math.PI * 2;
        var dist = 60 + Math.random() * 120;
        var b = document.createElement('div');
        b.className = 'glow-particle';
        b.style.left = cx + 'px';
        b.style.top = cy + 'px';
        var size = 3 + Math.random()*4;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.background = colors[Math.floor(Math.random()*colors.length)];
        b.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * dist - 100) + 'px');
        document.body.appendChild(b);
        setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 3000);
      }, delay);
    })(i * 40);
  }
}

function openOrb(){
  if (busy) return;
  busy = true;
  var rect = flower.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  // 标题和底部栏柔和淡出
  document.getElementById('title').classList.add('hide');
  document.getElementById('sig').classList.add('hide');
  document.getElementById('welcome').classList.add('hide');
  document.querySelector('.bottom-bar').classList.add('hide');
  // 花朵柔和缩小
  flower.classList.add('popped');
  // 花瓣柔和飘散
  var petals = document.querySelectorAll('.petal');
  for (var i = 0; i < petals.length; i++) {
    petals[i].classList.add('scatter-' + (i + 1));
  }
  var core = document.querySelector('.core');
  if (core) core.classList.add('scatter-core');
  // 柔和光粒子（不是暴力爆炸）
  softGlow(cx, cy);
  // 柔和光晕扩散
  var halo = document.createElement('div');
  halo.className = 'halo-soft';
  halo.style.left = cx + 'px';
  halo.style.top = cy + 'px';
  document.body.appendChild(halo);
  setTimeout(function(){ if(halo.parentNode) halo.parentNode.removeChild(halo); }, 1500);
  // 随机抽一张卡
  var drawIdx = Math.floor(Math.random() * CARDS.length);
  setTimeout(function(){
    flowerWrap.style.display = 'none';
    // 清除 scatter 类
    for (var k = 0; k < petals.length; k++) {
      petals[k].classList.remove('scatter-' + (k + 1));
    }
    if (core) core.classList.remove('scatter-core');
    // 直接显示随机卡片
    drawCard(drawIdx);
    cardWrap.classList.add('show');
    // 卡片出现时再来一波柔和光粒子
    softGlow(innerWidth/2, innerHeight/2);
    setTimeout(function(){ busy = false; }, 400);
  }, 900);
}

function buildOrbit(){
  orbitGrid.innerHTML = '';
  var n = CARDS.length;
  for (var i = 0; i < n; i++) {
    var card = document.createElement('div');
    card.className = 'orbit-card';
    // 背面（朝上，用户看到的神秘图案）
    var back = document.createElement('div');
    back.className = 'orbit-face back';
    back.innerHTML = '<div class="card-back-pattern">✦</div>';
    // 正面（翻开后显示内容）
    var c = CARDS[i];
    var front = document.createElement('div');
    front.className = 'orbit-face front';
    front.innerHTML =
      '<div class="orbit-kind">' + c.kind + '</div>' +
      '<div class="orbit-ico">' + c.ico + '</div>';
    card.appendChild(back);
    card.appendChild(front);
    // 已收集标记
    if (memory.collected[i]) card.classList.add('collected');
    (function(idx, el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        if (busy) return;
        selectOrbitCard(idx, el);
      });
    })(i, card);
    orbitGrid.appendChild(card);
  }
}

/* ===== 选中卡片：飞出翻牌 ===== */
function selectOrbitCard(idx, el){
  if (busy) return;
  busy = true;
  // 随机洗牌：用户点的是位置，实际抽到的内容是随机的
  var drawIdx = Math.floor(Math.random() * CARDS.length);
  var c = CARDS[drawIdx];
  // 选中卡片：飞向屏幕中央并翻转
  var rect = el.getBoundingClientRect();
  var cx = innerWidth / 2;
  var cy = innerHeight / 2;
  var dx = cx - (rect.left + rect.width / 2);
  var dy = cy - (rect.top + rect.height / 2);
  el.style.transition = 'transform 0.9s cubic-bezier(.4,0,.2,1), opacity 0.7s';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotateY(720deg) scale(2.2)';
  el.style.zIndex = '200';
  // 翻转中途更新正面内容
  setTimeout(function(){
    var front = el.querySelector('.orbit-face.front');
    front.innerHTML =
      '<div class="orbit-kind">' + c.kind + '</div>' +
      '<div class="orbit-ico">' + c.ico + '</div>';
  }, 300);
  // 其他卡片淡出
  var all = orbitGrid.querySelectorAll('.orbit-card');
  for (var i = 0; i < all.length; i++) {
    if (all[i] !== el) {
      all[i].style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
      all[i].style.opacity = '0';
      all[i].style.transform = 'scale(0.4) rotateY(180deg)';
    }
  }
  // 柔和光粒子
  setTimeout(function(){ softGlow(cx, cy); }, 400);
  // 1s 后打开卡片详情
  setTimeout(function(){
    drawCard(drawIdx);
    orbitGrid.innerHTML = '';
    cardWrap.classList.add('show');
    setTimeout(function(){ busy = false; }, 200);
  }, 950);
}

function showOrbit(){
  buildOrbit();
  orbitStage.classList.add('show');
  // 入场动画：从远处飞入
  var cards = orbitGrid.querySelectorAll('.orbit-card');
  for (var i = 0; i < cards.length; i++) {
    cards[i].style.opacity = '0';
    cards[i].style.transform = 'translateZ(-400px) scale(0.3) rotateY(180deg)';
    cards[i].style.transition = 'none';
  }
  setTimeout(function(){
    for (var i = 0; i < cards.length; i++) {
      (function(card, idx){
        setTimeout(function(){
          card.style.transition = 'transform 0.5s cubic-bezier(.3,1.2,.4,1), opacity 0.4s';
          card.style.opacity = '';
          card.style.transform = '';
        }, idx * 20);
      })(cards[i], i);
    }
    setTimeout(function(){ busy = false; }, cards.length * 20 + 500);
  }, 50);
}

function hideOrbit(){
  orbitStage.classList.remove('show');
  orbitGrid.innerHTML = '';
}

function closeOrb(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    hideOrbit();
    flowerWrap.style.display = '';
    flower.classList.remove('popped');
    // 标题和底部栏恢复
    document.getElementById('title').classList.remove('hide');
    document.getElementById('sig').classList.remove('hide');
    document.getElementById('welcome').classList.remove('hide');
    document.querySelector('.bottom-bar').classList.remove('hide');
    busy = false;
  }, 400);
}

// 点击光球（兼容桌面和移动端）
var lastTap = 0;
function handleOrbTap(e){
  if (e) e.preventDefault();
  var now = Date.now();
  if (now - lastTap < 500) return;
  lastTap = now;
  openOrb();
}
flower.addEventListener('click', function(e){ e.stopPropagation(); handleOrbTap(e); });
flower.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); handleOrbTap(e); }, {passive:false});

// 再翻一张：直接随机抽卡
nextBtn.addEventListener('click', function(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    var drawIdx = Math.floor(Math.random() * CARDS.length);
    drawCard(drawIdx);
    softGlow(innerWidth/2, innerHeight/2);
    cardWrap.classList.add('show');
    busy = false;
  }, 400);
});

// 放回去
closeBtn.addEventListener('click', closeOrb);
closeBtn.addEventListener('touchend', function(e){ e.preventDefault(); closeOrb(); }, {passive:false});

// 收集册
viewCollectedBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', function(e){
  if (e.target === modal) closeModal();
});

function openModal(){
  renderCollectList();
  modal.style.display = 'flex';
  setTimeout(function(){
    modal.classList.add('show');
  }, 10);
}
function closeModal(){
  modal.classList.remove('show');
  setTimeout(function(){
    modal.style.display = 'none';
  }, 400);
}

function renderCollectList(){
  var n = 0;
  for (var k in memory.collected) n++;
  collectedCount.textContent = n + ' / ' + CARDS.length;
  collectList.innerHTML = '';
  if (n === 0) {
    collectList.innerHTML = '<div class="empty">还没收集到任何卡片<br>点光球翻第一张吧 ✨</div>';
    return;
  }
  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    var has = memory.collected[i];
    var item = document.createElement('div');
    item.className = 'collect-item' + (has ? '' : ' locked');
    var desc = c.title || c.text.split('\n')[0];
    item.innerHTML =
      '<div class="ci-ico">' + (has ? c.ico : '❓') + '</div>' +
      '<div class="ci-info">' +
        '<div class="ci-name">' + (has ? (c.title || c.kind) : '未解锁') + '</div>' +
        '<div class="ci-desc">' + (has ? desc : '继续翻开试试') + '</div>' +
      '</div>' +
      '<div class="ci-kind">' + c.kind + '</div>';
    if (has) {
      (function(idx){
        item.addEventListener('click', function(){
          // 点击已收藏的卡片，可以直接打开看
          closeModal();
          currentIdx = idx;
          lastIdx = idx;
          var card = CARDS[idx];
          cKind.textContent = card.kind;
          cIco.textContent = card.ico;
          cTitle.textContent = card.title || '';
          cTitle.style.display = card.title ? 'block' : 'none';
          cText.textContent = card.text;
          cSub.textContent = card.sub || '';
          updateCollectBtn();
          flowerWrap.style.display = 'none';
          cardWrap.classList.add('show');
        });
      })(i);
    }
    collectList.appendChild(item);
  }
}
</script>
</body>
</html>
