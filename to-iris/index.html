<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 IRIS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1035 0%, #0d0820 55%, #060412 100%);
    color: #f0e8ff; min-height: 100vh;
    overflow: hidden;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position:fixed; top:0; left:0; right:0; bottom:0;
    display:block; pointer-events:none; z-index:0;
  }

  .stage {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    padding: 24px;
  }

  .signature {
    position: absolute; top: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 12px; letter-spacing: 6px; color: #b8a8e8;
    opacity: 0; transition: opacity 1s;
  }
  .signature.show { opacity: .8; }

  .title {
    font-size: 22px; font-weight: 500; letter-spacing: 3px;
    color: #e8d8ff; text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    -webkit-transform: translateY(0);
    transform: translateY(0);
    transition: opacity .5s, transform .5s;
  }
  .title.show { opacity: 1; }
  .title.hide { opacity: 0; -webkit-transform: translateY(-20px); transform: translateY(-20px); }

  .signature {
    transition: opacity .5s, transform .5s;
  }
  .signature.hide { opacity: 0 !important; -webkit-transform: translateY(-10px); transform: translateY(-10px); }

  .welcome {
    font-size: 14px; color: #c8a8d8; text-align: center;
    margin-bottom: 16px; letter-spacing: 1px;
    opacity: 0; transition: opacity .8s .5s;
    font-family: "PingFang SC", sans-serif;
    min-height: 42px; max-height: 80px;
  }
  .welcome.show { opacity: .85; }
  .welcome.hide { opacity: 0; -webkit-transform: translateY(-10px); transform: translateY(-10px); }
  .welcome .line2 { font-size: 11px; color: #8a7a9a; margin-top: 4px; display: block; }

  .flower-wrap {
    position: relative; width: 240px; height: 240px;
    margin-bottom: 28px;
    opacity: 0; -webkit-transform: scale(0.6); transform: scale(0.6);
    transition: opacity 1.5s .3s, transform 1.5s .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .flower-wrap.show { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }

  .flower {
    position: absolute; top:0; left:0; width:100%; height:100%;
    cursor: pointer;
    z-index: 5;
  }

  /* 中心坐标系：所有花瓣 transform-origin 都在花朵中心 */
  .lotus {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;  /* 0 尺寸的容器，仅作为旋转参考点 */
  }

  /* 花瓣公转环：外层和中层各自独立旋转，角速度不同 */
  .petal-ring {
    position: absolute; top: 0; left: 0;
    width: 0; height: 0;
    -webkit-transform-style: preserve-3d;
    transform-style: preserve-3d;
  }
  /* 外层：30秒一圈，逆时针，慢 */
  .outer-ring {
    -webkit-animation: orbitOuter 30s linear infinite;
    animation: orbitOuter 30s linear infinite;
  }
  /* 中层：18秒一圈，逆时针，快 */
  .mid-ring {
    -webkit-animation: orbitMid 18s linear infinite;
    animation: orbitMid 18s linear infinite;
  }
  @-webkit-keyframes orbitOuter { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(-360deg); } }
  @keyframes orbitOuter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @-webkit-keyframes orbitMid { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(-360deg); } }
  @keyframes orbitMid { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

  /* 花瓣：椭圆形，初始贴合中心，旋转出去 */
  .petal {
    position: absolute;
    left: -32px; top: -85px;  /* 中心点对齐莲花中心；椭圆向上 */
    width: 64px; height: 85px;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    -webkit-transform-origin: 32px 85px;  /* 椭圆底部中心 = 花朵中心 */
    transform-origin: 32px 85px;
    opacity: 0;
    box-shadow: inset -6px -6px 14px rgba(190,120,180,0.3),
                inset 4px 4px 10px rgba(255,255,255,0.4);
  }

  /* 外层大花瓣：12片，粉白色 */
  .petal.outer {
    background: linear-gradient(180deg,
      rgba(255,250,253,0.98) 0%,
      rgba(255,225,238,0.95) 35%,
      rgba(240,170,210,0.9) 75%,
      rgba(210,130,190,0.85) 100%);
  }
  .petal.outer.p1  { -webkit-animation: bloomP1  1.2s cubic-bezier(.25,.46,.45,.94) .04s forwards; animation: bloomP1  1.2s cubic-bezier(.25,.46,.45,.94) .04s forwards; }
  .petal.outer.p2  { -webkit-animation: bloomP2  1.2s cubic-bezier(.25,.46,.45,.94) .08s forwards; animation: bloomP2  1.2s cubic-bezier(.25,.46,.45,.94) .08s forwards; }
  .petal.outer.p3  { -webkit-animation: bloomP3  1.2s cubic-bezier(.25,.46,.45,.94) .12s forwards; animation: bloomP3  1.2s cubic-bezier(.25,.46,.45,.94) .12s forwards; }
  .petal.outer.p4  { -webkit-animation: bloomP4  1.2s cubic-bezier(.25,.46,.45,.94) .16s forwards; animation: bloomP4  1.2s cubic-bezier(.25,.46,.45,.94) .16s forwards; }
  .petal.outer.p5  { -webkit-animation: bloomP5  1.2s cubic-bezier(.25,.46,.45,.94) .20s forwards; animation: bloomP5  1.2s cubic-bezier(.25,.46,.45,.94) .20s forwards; }
  .petal.outer.p6  { -webkit-animation: bloomP6  1.2s cubic-bezier(.25,.46,.45,.94) .24s forwards; animation: bloomP6  1.2s cubic-bezier(.25,.46,.45,.94) .24s forwards; }
  .petal.outer.p7  { -webkit-animation: bloomP7  1.2s cubic-bezier(.25,.46,.45,.94) .28s forwards; animation: bloomP7  1.2s cubic-bezier(.25,.46,.45,.94) .28s forwards; }
  .petal.outer.p8  { -webkit-animation: bloomP8  1.2s cubic-bezier(.25,.46,.45,.94) .32s forwards; animation: bloomP8  1.2s cubic-bezier(.25,.46,.45,.94) .32s forwards; }
  .petal.outer.p9  { -webkit-animation: bloomP9  1.2s cubic-bezier(.25,.46,.45,.94) .36s forwards; animation: bloomP9  1.2s cubic-bezier(.25,.46,.45,.94) .36s forwards; }
  .petal.outer.p10 { -webkit-animation: bloomP10 1.2s cubic-bezier(.25,.46,.45,.94) .40s forwards; animation: bloomP10 1.2s cubic-bezier(.25,.46,.45,.94) .40s forwards; }
  .petal.outer.p11 { -webkit-animation: bloomP11 1.2s cubic-bezier(.25,.46,.45,.94) .44s forwards; animation: bloomP11 1.2s cubic-bezier(.25,.46,.45,.94) .44s forwards; }
  .petal.outer.p12 { -webkit-animation: bloomP12 1.2s cubic-bezier(.25,.46,.45,.94) .48s forwards; animation: bloomP12 1.2s cubic-bezier(.25,.46,.45,.94) .48s forwards; }

  /* 中层花瓣：8片，紫色，位置错开 */
  .petal.mid {
    width: 50px; height: 65px;
    left: -25px; top: -65px;
    -webkit-transform-origin: 25px 65px;
    transform-origin: 25px 65px;
    background: linear-gradient(180deg,
      rgba(248,235,255,0.95) 0%,
      rgba(220,180,240,0.9) 50%,
      rgba(170,120,210,0.85) 100%);
    box-shadow: inset -4px -4px 10px rgba(150,90,180,0.3),
                inset 3px 3px 8px rgba(255,255,255,0.4);
  }
  .petal.mid.m1 { -webkit-animation: bloomM1 1.0s cubic-bezier(.25,.46,.45,.94) .26s forwards; animation: bloomM1 1.0s cubic-bezier(.25,.46,.45,.94) .26s forwards; }
  .petal.mid.m2 { -webkit-animation: bloomM2 1.0s cubic-bezier(.25,.46,.45,.94) .30s forwards; animation: bloomM2 1.0s cubic-bezier(.25,.46,.45,.94) .30s forwards; }
  .petal.mid.m3 { -webkit-animation: bloomM3 1.0s cubic-bezier(.25,.46,.45,.94) .34s forwards; animation: bloomM3 1.0s cubic-bezier(.25,.46,.45,.94) .34s forwards; }
  .petal.mid.m4 { -webkit-animation: bloomM4 1.0s cubic-bezier(.25,.46,.45,.94) .38s forwards; animation: bloomM4 1.0s cubic-bezier(.25,.46,.45,.94) .38s forwards; }
  .petal.mid.m5 { -webkit-animation: bloomM5 1.0s cubic-bezier(.25,.46,.45,.94) .42s forwards; animation: bloomM5 1.0s cubic-bezier(.25,.46,.45,.94) .42s forwards; }
  .petal.mid.m6 { -webkit-animation: bloomM6 1.0s cubic-bezier(.25,.46,.45,.94) .46s forwards; animation: bloomM6 1.0s cubic-bezier(.25,.46,.45,.94) .46s forwards; }
  .petal.mid.m7 { -webkit-animation: bloomM7 1.0s cubic-bezier(.25,.46,.45,.94) .50s forwards; animation: bloomM7 1.0s cubic-bezier(.25,.46,.45,.94) .50s forwards; }
  .petal.mid.m8 { -webkit-animation: bloomM8 1.0s cubic-bezier(.25,.46,.45,.94) .54s forwards; animation: bloomM8 1.0s cubic-bezier(.25,.46,.45,.94) .54s forwards; }

  /* 花心 */
  .core {
    position: absolute; top: 50%; left: 50%;
    width: 40px; height: 40px;
    margin-top: -20px; margin-left: -20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8e0 0%, #ffd888 45%, #e8a850 100%);
    box-shadow: 0 0 18px rgba(255,200,120,0.55), inset 0 0 10px rgba(255,255,255,0.5);
    opacity: 0;
    -webkit-transform: scale(0);
    transform: scale(0);
    -webkit-animation: coreBloom 0.8s cubic-bezier(.34,1.56,.64,1) .50s forwards;
    animation: coreBloom 0.8s cubic-bezier(.34,1.56,.64,1) .50s forwards;
    z-index: 6;
  }
  .core::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,160,0.4) 0%, transparent 70%);
    -webkit-animation: coreGlow 3s ease-in-out infinite;
    animation: coreGlow 3s ease-in-out infinite;
  }

  /* 花粉点：装饰在花心上 */
  .pollen {
    position: absolute; top: 50%; left: 50%;
    width: 3px; height: 3px;
    margin-top: -1.5px; margin-left: -1.5px;
    border-radius: 50%; background: #c87028;
    z-index: 7;
    opacity: 0;
    -webkit-animation: pollenShow .8s ease-out 1.8s forwards;
    animation: pollenShow .8s ease-out 1.8s forwards;
  }

  /* 外层花瓣关键帧：统一从逆时针方向 -90deg 展开到各自扇区 */
  @-webkit-keyframes bloomP1  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(0deg) scale(1); opacity: .9; } }
  @keyframes bloomP1  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(0deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP2  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(30deg) scale(1); opacity: .9; } }
  @keyframes bloomP2  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(30deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP3  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(60deg) scale(1); opacity: .9; } }
  @keyframes bloomP3  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(60deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP4  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(90deg) scale(1); opacity: .9; } }
  @keyframes bloomP4  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(90deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP5  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(120deg) scale(1); opacity: .9; } }
  @keyframes bloomP5  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(120deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP6  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(150deg) scale(1); opacity: .9; } }
  @keyframes bloomP6  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(150deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP7  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(180deg) scale(1); opacity: .9; } }
  @keyframes bloomP7  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(180deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP8  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(210deg) scale(1); opacity: .9; } }
  @keyframes bloomP8  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(210deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP9  { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(240deg) scale(1); opacity: .9; } }
  @keyframes bloomP9  { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(240deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP10 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(270deg) scale(1); opacity: .9; } }
  @keyframes bloomP10 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(270deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP11 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(300deg) scale(1); opacity: .9; } }
  @keyframes bloomP11 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(300deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomP12 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(330deg) scale(1); opacity: .9; } }
  @keyframes bloomP12 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(330deg) scale(1); opacity: .9; } }

  /* 中层：统一从逆时针方向 -90deg 展开 */
  @-webkit-keyframes bloomM1 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(22.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM1 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(22.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM2 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(67.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM2 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(67.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM3 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(112.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM3 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(112.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM4 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(157.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM4 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(157.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM5 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(202.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM5 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(202.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM6 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(247.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM6 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(247.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM7 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(292.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM7 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(292.5deg) scale(1); opacity: .92; } }
  @-webkit-keyframes bloomM8 { 0% { -webkit-transform: rotate(-90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(337.5deg) scale(1); opacity: .92; } }
  @keyframes bloomM8 { 0% { transform: rotate(-90deg) scale(0); opacity: 0; } 100% { transform: rotate(337.5deg) scale(1); opacity: .92; } }

  @-webkit-keyframes coreBloom {
    0% { -webkit-transform: scale(0); opacity: 0; }
    70% { -webkit-transform: scale(1.2); opacity: 1; }
    100% { -webkit-transform: scale(1); opacity: 1; }
  }
  @keyframes coreBloom {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @-webkit-keyframes coreGlow {
    0%,100% { -webkit-transform: scale(1); opacity: .65; }
    50% { -webkit-transform: scale(1.3); opacity: .3; }
  }
  @keyframes coreGlow {
    0%,100% { transform: scale(1); opacity: .65; }
    50% { transform: scale(1.3); opacity: .3; }
  }
  @-webkit-keyframes pollenShow {
    0% { opacity: 0; -webkit-transform: scale(0); }
    100% { opacity: 1; -webkit-transform: scale(1); }
  }
  @keyframes pollenShow {
    0% { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  .flower.popped {
    -webkit-animation: flowerPop .4s cubic-bezier(.2,.9,.3,1.2) forwards;
    animation: flowerPop .4s cubic-bezier(.2,.9,.3,1.2) forwards;
  }

  .tap-ripple {
    position: absolute; top: 50%; left: 50%;
    width: 24px; height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    -webkit-animation: rippleExpand .6s ease-out forwards;
    animation: rippleExpand .6s ease-out forwards;
    pointer-events: none; z-index: 8;
  }
  @-webkit-keyframes rippleExpand {
    0% { -webkit-transform: scale(0.5); opacity: 1; }
    100% { -webkit-transform: scale(3); opacity: 0; }
  }
  @keyframes rippleExpand {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  .busy-shake {
    -webkit-animation: busyShake .35s ease-out !important;
    animation: busyShake .35s ease-out !important;
  }
  @-webkit-keyframes busyShake {
    0%,100% { -webkit-transform: translateX(0); }
    25% { -webkit-transform: translateX(-4px); }
    75% { -webkit-transform: translateX(4px); }
  }
  @keyframes busyShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @-webkit-keyframes flowerPop {
    0% { -webkit-transform: scale(1); opacity: 1; }
    40% { -webkit-transform: scale(1.2); opacity: .9; }
    100% { -webkit-transform: scale(0); opacity: 0; }
  }
  @keyframes flowerPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.2); opacity: .9; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* 花瓣爆开：每片花瓣朝外旋转飞散 */
  .petal.scatter-1  { -webkit-animation: scatter1  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter1  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-2  { -webkit-animation: scatter2  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter2  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-3  { -webkit-animation: scatter3  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter3  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-4  { -webkit-animation: scatter4  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter4  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-5  { -webkit-animation: scatter5  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter5  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-6  { -webkit-animation: scatter6  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter6  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-7  { -webkit-animation: scatter7  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter7  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-8  { -webkit-animation: scatter8  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter8  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }
  .petal.scatter-9  { -webkit-animation: scatter9  .9s cubic-bezier(.25,.7,.4,1) forwards !important; animation: scatter9  .9s cubic-bezier(.25,.7,.4,1) forwards !important; }

  /* 卡片 */
  .card-wrap {

    width: 88%; max-width: 340px;
    opacity: 0; pointer-events: none;
    transition: opacity .6s cubic-bezier(.2,.9,.3,1), transform .6s cubic-bezier(.2,.9,.3,1.2);
    z-index: 10;
  }
  .card-wrap.show {
    opacity: 1;
    -webkit-transform: translate(-50%, -50%) scale(1);
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .card {
    background: -webkit-linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 18px;
    padding: 32px 24px 24px;

    overflow: hidden;
  }
  .card::before {
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background: -webkit-linear-gradient(left, transparent, #ffd1a8, #e8a8d8, #b8a8e8, transparent);

  /* 卡片左上角关闭按钮 */

  /* ===== 稀有度系统 ===== */
  .rarity-tag {
    position: absolute; top: 12px; right: 14px;
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 6px;
    font-family: "PingFang SC", sans-serif;

  .rarity-tag.r { background: rgba(184,168,232,0.2); color: #b8a8e8; }
  .rarity-tag.sr { background: rgba(100,160,255,0.25); color: #8ac8ff; }
  .rarity-tag.ssr { background: rgba(200,130,255,0.3); color: #e8a8ff; }
  .rarity-tag.ur {
    background: linear-gradient(135deg, #d4a017, #b8860b);
    color: #2a1a00;
    -webkit-animation: urShine 2.4s ease-in-out infinite;
    animation: urShine 2.4s ease-in-out infinite;
  }
  @-webkit-keyframes urShine { 0%,100% { box-shadow: 0 0 4px rgba(212,160,23,0.4); } 50% { box-shadow: 0 0 10px rgba(255,180,0,0.55); } }
  @keyframes urShine { 0%,100% { box-shadow: 0 0 4px rgba(212,160,23,0.4); } 50% { box-shadow: 0 0 10px rgba(255,180,0,0.55); } }

  /* 稀有度边框 */
  .card.rarity-r { border-color: rgba(255,255,255,0.18); }
  .card.rarity-sr { border-color: rgba(100,160,255,0.4); box-shadow: 0 20px 60px rgba(60,100,200,0.4); }
  .card.rarity-ssr {
    border-color: rgba(200,130,255,0.5);
    box-shadow: 0 20px 60px rgba(140,60,200,0.5), 0 0 30px rgba(200,130,255,0.3);
  }
  /* UR 传说：暗金质感 + 动态流光，靠动效不靠亮度 */
  .card.rarity-ur {
    border: 1.5px solid transparent;
    background:
      -webkit-linear-gradient(160deg, rgba(60,45,20,0.35) 0%, rgba(30,22,10,0.25) 100%) padding-box,
      -webkit-linear-gradient(135deg, #8a6a1a 0%, #d4a017 50%, #8a6a1a 100%) border-box;
    background:
      linear-gradient(160deg, rgba(60,45,20,0.35) 0%, rgba(30,22,10,0.25) 100%) padding-box,
      linear-gradient(135deg, #8a6a1a 0%, #d4a017 50%, #8a6a1a 100%) border-box;
    box-shadow: 0 20px 50px rgba(100,70,0,0.35);
    -webkit-animation: urBreath 3.5s ease-in-out infinite;
    animation: urBreath 3.5s ease-in-out infinite;
  }
  /* 呼吸光晕：缓慢明暗，不是一直亮 */
  @-webkit-keyframes urBreath {
    0%,100% { box-shadow: 0 20px 50px rgba(100,70,0,0.3), 0 0 0 rgba(255,180,0,0); }
    50% { box-shadow: 0 20px 50px rgba(100,70,0,0.3), 0 0 28px rgba(255,180,0,0.22); }
  }
  @keyframes urBreath {
    0%,100% { box-shadow: 0 20px 50px rgba(100,70,0,0.3), 0 0 0 rgba(255,180,0,0); }
    50% { box-shadow: 0 20px 50px rgba(100,70,0,0.3), 0 0 28px rgba(255,180,0,0.22); }
  }
  /* 横扫流光带：柔化，不刺眼 */
  .card.rarity-ur::before {
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.35), rgba(255,140,0,0.22), rgba(255,215,0,0.35), transparent);
    opacity: 0.5;
  }
  /* 表面镭射扫光：斜向柔光带缓慢扫过，screen 混合只加亮不遮文字 */
  .card.rarity-ur::after {
    content: '';
    position: absolute; top: 0; left: -50%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,235,180,0.12) 50%, transparent 100%);
    -webkit-transform: skewX(-20deg);
    transform: skewX(-20deg);
    mix-blend-mode: screen;
    -webkit-animation: urSweep 4.5s ease-in-out infinite;
    animation: urSweep 4.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @-webkit-keyframes urSweep {
    0% { left: -50%; }
    55%,100% { left: 120%; }
  }
  @keyframes urSweep {
    0% { left: -50%; }
    55%,100% { left: 120%; }
  }

  @keyframes goldFly {

/* 判断当前可用的限定卡（节气+当月） */
function getActiveLimitedCards(){
  var now = new Date();
  var mmdd = (now.getMonth()+1<10?'0':'') + (now.getMonth()+1) + '-' + (now.getDate()<10?'0':'') + now.getDate();
  var active = [];
  // 节气卡
  for (var i=0; i<SEASONAL_CARDS.length; i++){
    var c = SEASONAL_CARDS[i];
    if (mmdd >= c.openStart && mmdd <= c.openEnd) active.push(c);
  }
  // 当月卡
  for (var j=0; j<MONTHLY_CARDS.length; j++){
    if (MONTHLY_CARDS[j].month === now.getMonth()) active.push(MONTHLY_CARDS[j]);
  }
  return active;
}

/* 预告：下一个限定卡及距离天数 */
function getNextLimitedPreview(){
  var now = new Date();
  var mmdd = (now.getMonth()+1<10?'0':'') + (now.getMonth()+1) + '-' + (now.getDate()<10?'0':'') + now.getDate();
  var candidates = [];
  for (var i=0; i<SEASONAL_CARDS.length; i++){
    var c = SEASONAL_CARDS[i];
    if (mmdd < c.openStart) candidates.push({ card:c, openDate:c.openStart, type:'节气' });
  }
  // 下个月卡
  var nextMonth = (now.getMonth()+1) % 12;
  candidates.push({ card: MONTHLY_CARDS[nextMonth], openDate: (nextMonth+1<10?'0':'')+(nextMonth+1)+'-01', type:'月份' });
  if (candidates.length === 0) return null;
  // 选最近的
  candidates.sort(function(a,b){ return a.openDate < b.openDate ? -1 : 1; });
  var next = candidates[0];
  // 算天数
  var parts = next.openDate.split('-');
  var target = new Date(now.getFullYear(), parseInt(parts[0])-1, parseInt(parts[1]));
  var diff = Math.ceil((target - now) / (1000*60*60*24));
  if (diff < 0) diff = 0;
  return { card: next.card, days: diff, type: next.type };
}

/* ===== 星空 ===== */
var canvas = document.getElementById('stars');
var ctx = canvas.getContext('2d');
var W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

var stars = [];
for (var i=0; i<150; i++){
  stars.push({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6 + 0.2,
    vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08,
    a: Math.random()*0.6 + 0.2,
    tw: Math.random()*Math.PI*2,
    tws: 0.02 + Math.random()*0.03
  });
}
var meteors = [];

function tick(){
  ctx.clearRect(0,0,W,H);
  for (var i=0; i<stars.length; i++){
    var s = stars[i];
    s.x += s.vx; s.y += s.vy;
    if (s.x<0) s.x=W; if (s.x>W) s.x=0;
    if (s.y<0) s.y=H; if (s.y>H) s.y=0;
    s.tw += s.tws;
    var alpha = s.a * (0.5 + 0.5*Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = alpha;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 流星
  if (Math.random() < 0.006 && meteors.length < 3) {
    meteors.push({
      x: Math.random()*W*0.6, y: Math.random()*H*0.3,
      vx: 6 + Math.random()*4, vy: 3 + Math.random()*2,
      len: 80 + Math.random()*60, a: 1
    });
  }
  for (var j = meteors.length - 1; j >= 0; j--) {
    var m = meteors[j];
    m.x += m.vx; m.y += m.vy; m.a -= 0.015;
    if (m.a <= 0 || m.x > W) { meteors.splice(j, 1); continue; }
    var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.len, m.y - m.len*0.5);
    grad.addColorStop(0, 'rgba(255,255,255,' + m.a + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.len, m.y - m.len*0.5);
    ctx.stroke();
  }
  requestAnimationFrame(tick);
}
tick();

function getTodayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function markVisit(){
  memory.visitCount++;
  var today = getTodayStr();
  // 连续天数追踪
  if (memory.lastVisitDateStr && memory.lastVisitDateStr !== today) {
    var last = new Date(memory.lastVisitDateStr);
    var diff = Math.floor((new Date(today) - last) / (1000*60*60*24));
    if (diff === 1) memory.consecutiveDays++;
    else memory.consecutiveDays = 1;
  } else if (!memory.lastVisitDateStr) {
    memory.consecutiveDays = 1;
  }
  memory.lastVisitDateStr = today;
  memory.lastVisitTime = Date.now();
  saveMemory();
}

function padNum(n){ return n<10?'0'+n:''+n; }

function formatVisitTime(ts){
  var d = new Date(ts);
  var now = new Date();
  var today = now.getFullYear()+'-'+padNum(now.getMonth()+1)+'-'+padNum(now.getDate());
  var dateStr = d.getFullYear()+'-'+padNum(d.getMonth()+1)+'-'+padNum(d.getDate());
  var time = padNum(d.getHours())+':'+padNum(d.getMinutes());
  if (dateStr === today) return '今天 ' + time;
  var y = new Date(now); y.setDate(now.getDate()-1);
  var yStr = y.getFullYear()+'-'+padNum(y.getMonth()+1)+'-'+padNum(y.getDate());
  if (dateStr === yStr) return '昨天 ' + time;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+time;
}

var busy = false;

function getCard(idx){
  if (idx < CARDS.length) return CARDS[idx];
  var hi = idx - CARDS.length;
  return HIDDEN_CARDS[hi] || CARDS[0];
}

function checkHiddenUnlocks(){
  // 检查隐藏卡解锁条件，返回新解锁的卡片索引列表
  var newlyUnlocked = [];
  var hour = new Date().getHours();
  for (var i = 0; i < HIDDEN_CARDS.length; i++) {
    var h = HIDDEN_CARDS[i];
    var realIdx = CARDS.length + i;
    if (memory.unlockedHidden[realIdx]) continue; // 已解锁
    var should = false;
    if (h.unlockVisit && memory.visitCount >= h.unlockVisit) should = true;
    if (h.unlockStreak && memory.consecutiveDays >= h.unlockStreak) should = true;
    if (h.unlockFlips && memory.totalFlips >= h.unlockFlips) should = true;
    if (should) {
      memory.unlockedHidden[realIdx] = { time: Date.now() };
      newlyUnlocked.push(realIdx);
    }
  }
  if (newlyUnlocked.length) saveMemory();
  return newlyUnlocked;
}

function smartDraw(){
  // 检查隐藏卡解锁
  var newlyUnlocked = checkHiddenUnlocks();
  // 新解锁的UR卡：50%概率惊喜出现
  if (newlyUnlocked.length > 0 && Math.random() < 0.5) {
    return newlyUnlocked[0];
  }
  // 夜间晚安卡（UR）：22-5点 20%概率
  var hour = new Date().getHours();
  if (hour >= 22 || hour < 5) {
    if (Math.random() < 0.2) {
      return CARDS.length + 1; // 晚安卡
    }
  }
  // 已解锁UR卡：10%概率混入
  var unlockedKeys = [];
  for (var k in memory.unlockedHidden) unlockedKeys.push(parseInt(k));
  if (unlockedKeys.length > 0 && Math.random() < 0.1) {
    return unlockedKeys[Math.floor(Math.random() * unlockedKeys.length)];
  }
  // 主抽卡：档位制（UR 5% / SSR 15% / SR 30% / R 50%）
  var roll = Math.random();
  var tier;
  if (roll < 0.05) tier = 'UR';
  else if (roll < 0.20) tier = 'SSR';
  else if (roll < 0.50) tier = 'SR';
  else tier = 'R';
  // 收集该档位的卡池
  var pool = [];
  for (var i = 0; i < CARDS.length; i++) {
    if (CARDS[i].rarity === tier) pool.push(i);
  }
  // UR 档把已解锁隐藏卡也加入池
  if (tier === 'UR') {
    for (var u = 0; u < unlockedKeys.length; u++) pool.push(unlockedKeys[u]);
  }
  if (pool.length === 0) { tier = 'R'; pool = []; for (var r=0; r<CARDS.length; r++) if (CARDS[r].rarity==='R') pool.push(r); }
  // 档位内：优先未收集（高收藏量）
  var uncollected = [];
  for (var p = 0; p < pool.length; p++) {
    if (!memory.collected[pool[p]]) uncollected.push(pool[p]);
  }
  var chosen;
  if (uncollected.length > 0) {
    chosen = uncollected[Math.floor(Math.random() * uncollected.length)];
  } else {
    chosen = pool[Math.floor(Math.random() * pool.length)];
  }
  return chosen;
}

/* 限定卡抽卡：每日免费1次，从当前可用限定卡中抽 */
function canDrawLimitedToday(){
  var today = getTodayStr();
  return memory.lastLimitedDrawDate !== today;
}
function drawLimited(){
  if (!canDrawLimitedToday()) return null;
  var active = getActiveLimitedCards();
  if (active.length === 0) return null;
  memory.lastLimitedDrawDate = getTodayStr();
  // 优先未收集的限定卡
  var uncollected = [];
  for (var i = 0; i < active.length; i++) {
    var id = active[i].id || ('month_' + active[i].month);
    if (!memory.limitedCollected[id]) uncollected.push(active[i]);
  }
  var card = uncollected.length > 0
    ? uncollected[Math.floor(Math.random() * uncollected.length)]
    : active[Math.floor(Math.random() * active.length)];
  var cardId = card.id || ('month_' + card.month);
  if (!memory.limitedCollected[cardId]) {
    memory.limitedCollected[cardId] = { time: Date.now() };
  }
  saveMemory();
  return card;
}

function drawCard(idx, isDaily){
  currentIdx = idx;
  memory.lastCardIdx = idx;
  memory.totalFlips++;
  if (!memory.collected[idx]) {
    memory.collected[idx] = { time: Date.now() };
  }
  // 每日签记录
  var today = getTodayStr();
  if (isDaily) {
    memory.lastDailyDate = today;
    memory.dailyFortuneIdx = Math.floor(Math.random() * DAILY_FORTUNES.length);
  }
  saveMemory();
  var c = getCard(idx);
  var theCard = document.getElementById('theCard');
  var dailyBanner = document.getElementById('dailyBanner');
  // 每日签样式
  theCard.classList.toggle('daily-card', !!isDaily);
  if (isDaily && memory.dailyFortuneIdx != null) {
    var fortune = DAILY_FORTUNES[memory.dailyFortuneIdx];
    var dateStr = new Date().getMonth()+1 + '月' + new Date().getDate() + '日';
    dailyBanner.innerHTML = '✦ 今日签语 ✦<span class="daily-date">' + dateStr + ' · ' + fortune + '</span>';
    dailyBanner.style.display = 'block';
    dailyBanner.classList.add('show');
  } else {
    dailyBanner.style.display = 'none';
    dailyBanner.classList.remove('show');
  }
  cKind.textContent = c.kind;
  cIco.textContent = c.ico;
  cTitle.textContent = c.title || '';
  cTitle.style.display = c.title ? 'block' : 'none';
  cText.textContent = c.text;
  cSub.textContent = c.sub || '';
  // 稀有度角标
  var rarityTag = document.getElementById('rarityTag');
  if (rarityTag) {
    var rar = c.rarity || 'R';
    rarityTag.textContent = rar;
    rarityTag.className = 'rarity-tag ' + rar.toLowerCase();
    rarityTag.style.display = 'block';
  }
  // 稀有度边框 + 金光动画
  theCard.className = 'card';
  var rar = c.rarity || 'R';
  if (isDaily) theCard.classList.add('daily-card');
  theCard.classList.add('rarity-' + rar.toLowerCase());
  // UR 金光爆发
  if (rar === 'UR') triggerGoldBurst();
  else if (rar === 'SSR') triggerPurpleGlow();
  count++;
  counter.textContent = '已翻开 ' + count + ' 张';
  updateCollectionProgress();
  checkStoryChains();
}

    if (chain.condition(memory)) {

  var normalCollected = 0;

/* 柔和光粒子：缓慢上升飘散 */
function softGlow(cx, cy){
  var colors = ['rgba(255,209,168,0.8)','rgba(232,168,216,0.8)','rgba(184,168,232,0.7)','rgba(168,216,255,0.6)','rgba(255,245,232,0.9)'];
  for (var i = 0; i < 24; i++) {
    (function(delay){
      setTimeout(function(){
        var ang = Math.random() * Math.PI * 2;
        var dist = 60 + Math.random() * 120;
        var b = document.createElement('div');
        b.className = 'glow-particle';
        b.style.left = cx + 'px';
        b.style.top = cy + 'px';
        var size = 3 + Math.random()*4;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.background = colors[Math.floor(Math.random()*colors.length)];
        b.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * dist - 100) + 'px');
        document.body.appendChild(b);
        setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 3000);
      }, delay);
    })(i * 40);
  }
}

      '<div class="orbit-kind">' + c.kind + '</div>' +

    card.appendChild(front);

      el.addEventListener('click', function(e){
        e.stopPropagation();
        if (busy) return;
        selectOrbitCard(idx, el);
      });

}

function selectOrbitCard(idx, el){
  if (busy) return;
  busy = true;
  // 智能抽卡（含隐藏卡）
  var drawIdx = smartDraw();
  var c = getCard(drawIdx);
  var today = getTodayStr();
  var isDaily = (memory.lastDailyDate !== today);
  // 选中卡片：飞向屏幕中央并翻转
  var rect = el.getBoundingClientRect();
  var cx = innerWidth / 2;
  var cy = innerHeight / 2;
  var dx = cx - (rect.left + rect.width / 2);
  var dy = cy - (rect.top + rect.height / 2);
  el.style.transition = 'transform 0.6s cubic-bezier(.4,0,.2,1), opacity 0.7s';
  el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotateY(720deg) scale(2.2)';
  el.style.zIndex = '200';
  // 翻转中途更新正面内容
  setTimeout(function(){
    var front = el.querySelector('.orbit-face.front');
    front.innerHTML =
      '<div class="orbit-kind">' + c.kind + '</div>' +
      '<div class="orbit-ico">' + c.ico + '</div>';
  }, 300);
  // 其他卡片淡出
  var all = orbitGrid.querySelectorAll('.orbit-card');
  for (var i = 0; i < all.length; i++) {
    if (all[i] !== el) {
      all[i].style.transition = 'transform 0.5s ease-out, opacity 0.5s ease-out';
      all[i].style.opacity = '0';
      all[i].style.transform = 'scale(0.4) rotateY(180deg)';
    }
  }
  // 柔和光粒子
  setTimeout(function(){ softGlow(cx, cy); }, 400);
  // 1s 后打开卡片详情
  setTimeout(function(){
    drawCard(drawIdx, isDaily);
    orbitGrid.innerHTML = '';
    cardWrap.classList.add('show');
    setTimeout(function(){ busy = false; }, 100);
  }, 650);
}

    flowerWrap.style.display = '';
    flower.classList.remove('popped');
    // 重新触发花朵绽放动画（通过克隆节点重置CSS动画）
    var lotus = flower.querySelector('.lotus');
    if (lotus) {
      var newLotus = lotus.cloneNode(true);
      lotus.parentNode.replaceChild(newLotus, lotus);
    }
    // 标题和底部栏恢复
    document.getElementById('title').classList.remove('hide');
    document.getElementById('sig').classList.remove('hide');
    document.getElementById('welcome').classList.remove('hide');
    document.querySelector('.bottom-bar').classList.remove('hide');
    busy = false;
  }, 400);
}

// 点击光球（兼容桌面和移动端）
var lastTap = 0;
function handleOrbTap(e){
  if (e) e.preventDefault();
  if (busy) {
    var el = document.querySelector('.flower-wrap');
    if (el) { el.classList.remove('busy-shake'); void el.offsetWidth; el.classList.add('busy-shake'); }
    return;
  }
  var now = Date.now();
  if (now - lastTap < 500) return;
  lastTap = now;
  var wrap = document.getElementById('flowerWrap');
  var ri = document.createElement('div');
  ri.className = 'tap-ripple';
  wrap.appendChild(ri);
  setTimeout(function(){ if(ri.parentNode) ri.parentNode.removeChild(ri); }, 700);
  openOrb();
}
function isInFlower(el){
  while (el) { if (el.id === 'flower' || el.id === 'flowerWrap') return true; el = el.parentNode; }
  return false;
}
function onStageTap(e){
  if (cardWrap.classList.contains('show')) return;
  if (orbitStage.classList.contains('show')) return;
  if (isInFlower(e.target)) { handleOrbTap(e); }
}
document.addEventListener('click', onStageTap);
document.addEventListener('touchend', function(e){
  if (cardWrap.classList.contains('show')) return;
  if (orbitStage.classList.contains('show')) return;
  if (isInFlower(e.target)) { e.preventDefault(); handleOrbTap(e); }
}, {passive:false});

// 再翻一张：智能抽卡
nextBtn.addEventListener('click', function(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    var drawIdx = smartDraw();
    var today = getTodayStr();
    var isDaily = (memory.lastDailyDate !== today);
    drawCard(drawIdx, isDaily);
    softGlow(innerWidth/2, innerHeight/2);
    cardWrap.classList.add('show');
    busy = false;
  }, 400);
});

// 放回去
closeBtn.addEventListener('click', closeOrb);
closeBtn.addEventListener('touchend', function(e){ e.preventDefault(); closeOrb(); }, {passive:false});
// 左上角叉叉关闭
var cardCloseBtn = document.getElementById('cardClose');
cardCloseBtn.addEventListener('click', closeOrb);
cardCloseBtn.addEventListener('touchend', function(e){ e.preventDefault(); closeOrb(); }, {passive:false});

// 收集册
viewCollectedBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', function(e){
  if (e.target === modal) closeModal();
});

function openModal(){
  renderCollectList();
  modal.style.display = 'flex';
  setTimeout(function(){
    modal.classList.add('show');
  }, 10);
}
function closeModal(){
  modal.classList.remove('show');
  setTimeout(function(){
    modal.style.display = 'none';
  }, 400);
}

function renderCollectList(){
  // 统计
  var normalGot = 0, limitedGot = 0;
  for (var k in memory.collected) normalGot++;
  for (var l in memory.limitedCollected) limitedGot++;
  var totalNormal = CARDS.length + HIDDEN_CARDS.length;
  var totalLimited = SEASONAL_CARDS.length + MONTHLY_CARDS.length;
  collectedCount.textContent = (normalGot + limitedGot) + ' / ' + (totalNormal + totalLimited);
  collectList.innerHTML = '';
  if (normalGot === 0 && limitedGot === 0) {
    collectList.innerHTML = '<div class="empty">还没收集到任何卡片<br>点光球翻第一张吧 ✨</div>';
    return;
  }

  // 辅助：渲染单张迷你卡
  function miniCard(ico, name, rar, collected, opts){
    opts = opts || {};
    var cls = 'collect-mini-card';
    if (collected) cls += ' collected';
    else if (opts.locked) cls += ' locked';
    if (opts.expired) cls += ' expired';
    var tag = '<div class="mini-tag ' + (rar||'r').toLowerCase() + '">' + (rar||'R') + '</div>';
    var showContent = collected || opts.expired || !opts.locked;
    return '<div class="' + cls + '">' +
      '<div class="mini-ico">' + (showContent ? ico : '') + '</div>' +
      '<div class="mini-name">' + (showContent ? name : '???') + '</div>' +
      tag + '</div>';
  }

  // UR 传说区（隐藏卡）
  var urSection = document.createElement('div');
  urSection.className = 'collect-section';
  var urGot = 0;
  for (var u = 0; u < HIDDEN_CARDS.length; u++) if (memory.collected[CARDS.length + u]) urGot++;
  urSection.innerHTML = '<div class="collect-section-title"><span class="tier-ur">✦ UR 传说</span> ' + urGot + '/' + HIDDEN_CARDS.length + '</div>';
  for (var ui = 0; ui < HIDDEN_CARDS.length; ui++) {
    var realIdx = CARDS.length + ui;
    var hc = HIDDEN_CARDS[ui];
    var hHas = memory.collected[realIdx];
    var unlocked = memory.unlockedHidden[realIdx] || hc.nightOnly;
    urSection.innerHTML += miniCard(hc.ico, hc.title, 'UR', hHas, { locked: !unlocked && !hHas });
  }
  collectList.appendChild(urSection);

  // SSR 史诗区
  var ssrSection = document.createElement('div');
  ssrSection.className = 'collect-section';
  var ssrGot = 0, ssrTotal = 0;
  for (var s1 = 0; s1 < CARDS.length; s1++) if (CARDS[s1].rarity === 'SSR') { ssrTotal++; if (memory.collected[s1]) ssrGot++; }
  ssrSection.innerHTML = '<div class="collect-section-title"><span class="tier-ssr">✦ SSR 史诗</span> ' + ssrGot + '/' + ssrTotal + '</div>';
  for (var s2 = 0; s2 < CARDS.length; s2++) {
    if (CARDS[s2].rarity !== 'SSR') continue;
    var sHas = memory.collected[s2];
    ssrSection.innerHTML += miniCard(CARDS[s2].ico, CARDS[s2].title || CARDS[s2].text.split('\n')[0].slice(0,6), 'SSR', sHas, { locked: !sHas });
  }
  collectList.appendChild(ssrSection);

  // SR 稀有区
  var srSection = document.createElement('div');
  srSection.className = 'collect-section';
  var srGot = 0, srTotal = 0;
  for (var r1 = 0; r1 < CARDS.length; r1++) if (CARDS[r1].rarity === 'SR') { srTotal++; if (memory.collected[r1]) srGot++; }
  srSection.innerHTML = '<div class="collect-section-title"><span class="tier-sr">✦ SR 稀有</span> ' + srGot + '/' + srTotal + '</div>';
  for (var r2 = 0; r2 < CARDS.length; r2++) {
    if (CARDS[r2].rarity !== 'SR') continue;
    var rHas = memory.collected[r2];
    srSection.innerHTML += miniCard(CARDS[r2].ico, CARDS[r2].title || CARDS[r2].kind, 'SR', rHas, { locked: !rHas });
  }
  collectList.appendChild(srSection);

  // R 普通区
  var rSection = document.createElement('div');
  rSection.className = 'collect-section';
  var rGot = 0, rTotal = 0;
  for (var n1 = 0; n1 < CARDS.length; n1++) if (CARDS[n1].rarity === 'R') { rTotal++; if (memory.collected[n1]) rGot++; }
  rSection.innerHTML = '<div class="collect-section-title"><span class="tier-r">✦ R 普通</span> ' + rGot + '/' + rTotal + '</div>';
  for (var n2 = 0; n2 < CARDS.length; n2++) {
    if (CARDS[n2].rarity !== 'R') continue;
    var nHas = memory.collected[n2];
    rSection.innerHTML += miniCard(CARDS[n2].ico, CARDS[n2].title || CARDS[n2].text.split('\n')[0].slice(0,6), 'R', nHas, { locked: !nHas });
  }
  collectList.appendChild(rSection);

  // 限定卡区
  var limSection = document.createElement('div');
  limSection.className = 'collect-section';
  limSection.innerHTML = '<div class="collect-section-title"><span class="tier-limited">✦ 限定卡</span> ' + limitedGot + '/' + totalLimited + '</div>';
  var now = new Date();
  var mmdd = (now.getMonth()+1<10?'0':'') + (now.getMonth()+1) + '-' + (now.getDate()<10?'0':'') + now.getDate();
  // 节气卡
  for (var si = 0; si < SEASONAL_CARDS.length; si++) {
    var sc = SEASONAL_CARDS[si];
    var sId = sc.id;
    var sCollected = memory.limitedCollected[sId];
    var sExpired = mmdd < sc.openStart || mmdd > sc.openEnd;
    limSection.innerHTML += miniCard(sc.ico, sc.title, 'SSR', sCollected, { expired: sExpired && !sCollected, locked: !sCollected && !sExpired });
  }
  // 月份卡
  for (var mi = 0; mi < MONTHLY_CARDS.length; mi++) {
    var mc = MONTHLY_CARDS[mi];
    var mId = 'month_' + mc.month;
    var mCollected = memory.limitedCollected[mId];
    var mExpired = mc.month !== now.getMonth();
    limSection.innerHTML += miniCard(mc.ico, mc.title, 'SSR', mCollected, { expired: mExpired && !mCollected, locked: !mCollected && !mExpired });
  }
  collectList.appendChild(limSection);

  // 剧情故事区
  if (!memory.unlockedStories) memory.unlockedStories = {};
  var storySection = document.createElement('div');
  storySection.className = 'collect-section';
  var storyCount = 0;
  for (var stId in memory.unlockedStories) storyCount++;
  storySection.innerHTML = '<div class="collect-section-title" style="border-color:rgba(255,200,120,0.2);">✦ 剧情故事 <span style="font-size:10px;color:#8a7a9a;font-weight:400;">' + storyCount + '/' + STORY_CHAINS.length + '</span></div>';
  for (var sti = 0; sti < STORY_CHAINS.length; sti++) {
    var st = STORY_CHAINS[sti];
    var stUnlocked = memory.unlockedStories[st.id];
    var stItem = document.createElement('div');
    stItem.className = 'collect-item' + (stUnlocked ? '' : ' locked');
    if (stUnlocked) {
      stItem.innerHTML =
        '<div class="ci-ico" style="font-size:22px;">' + st.icon + '</div>' +
        '<div class="ci-info"><div class="ci-name">' + st.name + '</div>' +
        '<div class="ci-desc">' + st.desc + '</div></div>' +
        '<span class="ci-kind" style="cursor:pointer;letter-spacing:1px;">阅读</span>';
      stItem.addEventListener('click', (function(id){ return function(){ showStory(id); }; })(st.id));
    } else {
      stItem.innerHTML =
        '<div class="ci-ico" style="font-size:18px;opacity:0.4;">🔒</div>' +
        '<div class="ci-info"><div class="ci-name" style="color:#6a5a8a;">???</div>' +
        '<div class="ci-desc">点击条件未知</div></div>' +
        '<span class="ci-kind" style="opacity:0.3;">🔒</span>';
    }
    storySection.appendChild(stItem);
  }
  collectList.appendChild(storySection);
}
</script>
