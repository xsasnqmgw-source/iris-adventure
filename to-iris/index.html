<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 IRIS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1035 0%, #0d0820 55%, #060412 100%);
    color: #f0e8ff; min-height: 100vh;
    overflow: hidden;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position:fixed; top:0; left:0; right:0; bottom:0;
    display:block; pointer-events:none; z-index:0;
  }

  .stage {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    padding: 24px;
  }

  .signature {
    position: absolute; top: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 12px; letter-spacing: 6px; color: #b8a8e8;
    opacity: 0; transition: opacity 1s;
  }
  .signature.show { opacity: .8; }

  .title {
    font-size: 22px; font-weight: 500; letter-spacing: 3px;
    color: #e8d8ff; text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    -webkit-transform: translateY(0);
    transform: translateY(0);
    transition: opacity .5s, transform .5s;
  }
  .title.show { opacity: 1; }
  .title.hide { opacity: 0; -webkit-transform: translateY(-20px); transform: translateY(-20px); }

  .signature {
    transition: opacity .5s, transform .5s;
  }
  .signature.hide { opacity: 0 !important; -webkit-transform: translateY(-10px); transform: translateY(-10px); }

  .welcome {
    font-size: 14px; color: #c8a8d8; text-align: center;
    margin-bottom: 16px; letter-spacing: 1px;
    opacity: 0; transition: opacity .8s .5s;
    font-family: "PingFang SC", sans-serif;
    height: 42px;
  }
  .welcome.show { opacity: .85; }
  .welcome.hide { opacity: 0; -webkit-transform: translateY(-10px); transform: translateY(-10px); }
  .welcome .line2 { font-size: 11px; color: #8a7a9a; margin-top: 4px; display: block; }

  .flower-wrap {
    position: relative; width: 240px; height: 240px;
    margin-bottom: 28px;
    opacity: 0; -webkit-transform: scale(0.6); transform: scale(0.6);
    transition: opacity 1.5s .3s, transform 1.5s .3s cubic-bezier(.2,.9,.3,1.2);
  }
  .flower-wrap.show { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }

  .flower {
    position: absolute; top:0; left:0; width:100%; height:100%;
    cursor: pointer;
    z-index: 5;
  }

  /* 借鉴 CSS3 Lotus 技法：border-radius 生成花瓣 */
  .lotus-wrap {
    position: absolute; top:0; left:0; width:100%; height:100%;
    -webkit-transform: rotate(-45deg); transform: rotate(-45deg);
  }

  .lotus {
    position: absolute; top: 50%; left: 50%;
    width: 200px; height: 200px;
    margin-top: -100px; margin-left: -100px;
  }

  .petal {
    position: absolute; top: 0; right: 0;
    width: 100px; height: 100px;
    border-radius: 0 60% 0 90%;
    -webkit-transform-origin: top right;
    transform-origin: top right;
    opacity: 0;
    box-shadow: inset -10px 10px 20px rgba(255,255,255,0.25);
  }

  /* 外层大花瓣：10片 */
  .petal.outer {
    background: linear-gradient(135deg, rgba(255,240,250,0.95) 0%, rgba(255,200,225,0.9) 30%, rgba(232,160,205,0.85) 70%, rgba(190,120,180,0.8) 100%);
  }
  .petal.outer:nth-child(1)  { -webkit-animation: bloomOut1  2.4s cubic-bezier(.25,.46,.45,.94) .10s forwards; animation: bloomOut1  2.4s cubic-bezier(.25,.46,.45,.94) .10s forwards; }
  .petal.outer:nth-child(2)  { -webkit-animation: bloomOut2  2.4s cubic-bezier(.25,.46,.45,.94) .20s forwards; animation: bloomOut2  2.4s cubic-bezier(.25,.46,.45,.94) .20s forwards; }
  .petal.outer:nth-child(3)  { -webkit-animation: bloomOut3  2.4s cubic-bezier(.25,.46,.45,.94) .30s forwards; animation: bloomOut3  2.4s cubic-bezier(.25,.46,.45,.94) .30s forwards; }
  .petal.outer:nth-child(4)  { -webkit-animation: bloomOut4  2.4s cubic-bezier(.25,.46,.45,.94) .40s forwards; animation: bloomOut4  2.4s cubic-bezier(.25,.46,.45,.94) .40s forwards; }
  .petal.outer:nth-child(5)  { -webkit-animation: bloomOut5  2.4s cubic-bezier(.25,.46,.45,.94) .50s forwards; animation: bloomOut5  2.4s cubic-bezier(.25,.46,.45,.94) .50s forwards; }
  .petal.outer:nth-child(6)  { -webkit-animation: bloomOut6  2.4s cubic-bezier(.25,.46,.45,.94) .60s forwards; animation: bloomOut6  2.4s cubic-bezier(.25,.46,.45,.94) .60s forwards; }
  .petal.outer:nth-child(7)  { -webkit-animation: bloomOut7  2.4s cubic-bezier(.25,.46,.45,.94) .70s forwards; animation: bloomOut7  2.4s cubic-bezier(.25,.46,.45,.94) .70s forwards; }
  .petal.outer:nth-child(8)  { -webkit-animation: bloomOut8  2.4s cubic-bezier(.25,.46,.45,.94) .80s forwards; animation: bloomOut8  2.4s cubic-bezier(.25,.46,.45,.94) .80s forwards; }
  .petal.outer:nth-child(9)  { -webkit-animation: bloomOut9  2.4s cubic-bezier(.25,.46,.45,.94) .90s forwards; animation: bloomOut9  2.4s cubic-bezier(.25,.46,.45,.94) .90s forwards; }
  .petal.outer:nth-child(10) { -webkit-animation: bloomOut10 2.4s cubic-bezier(.25,.46,.45,.94) 1.0s forwards; animation: bloomOut10 2.4s cubic-bezier(.25,.46,.45,.94) 1.0s forwards; }

  /* 中层花瓣：10片，更小 */
  .petal.mid {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, rgba(245,235,255,0.95) 0%, rgba(225,190,245,0.9) 40%, rgba(180,140,220,0.85) 100%);
  }
  .petal.mid:nth-child(11) { -webkit-animation: bloomMid1  2.2s cubic-bezier(.25,.46,.45,.94) .55s forwards; animation: bloomMid1  2.2s cubic-bezier(.25,.46,.45,.94) .55s forwards; }
  .petal.mid:nth-child(12) { -webkit-animation: bloomMid2  2.2s cubic-bezier(.25,.46,.45,.94) .65s forwards; animation: bloomMid2  2.2s cubic-bezier(.25,.46,.45,.94) .65s forwards; }
  .petal.mid:nth-child(13) { -webkit-animation: bloomMid3  2.2s cubic-bezier(.25,.46,.45,.94) .75s forwards; animation: bloomMid3  2.2s cubic-bezier(.25,.46,.45,.94) .75s forwards; }
  .petal.mid:nth-child(14) { -webkit-animation: bloomMid4  2.2s cubic-bezier(.25,.46,.45,.94) .85s forwards; animation: bloomMid4  2.2s cubic-bezier(.25,.46,.45,.94) .85s forwards; }
  .petal.mid:nth-child(15) { -webkit-animation: bloomMid5  2.2s cubic-bezier(.25,.46,.45,.94) .95s forwards; animation: bloomMid5  2.2s cubic-bezier(.25,.46,.45,.94) .95s forwards; }
  .petal.mid:nth-child(16) { -webkit-animation: bloomMid6  2.2s cubic-bezier(.25,.46,.45,.94) 1.05s forwards; animation: bloomMid6  2.2s cubic-bezier(.25,.46,.45,.94) 1.05s forwards; }
  .petal.mid:nth-child(17) { -webkit-animation: bloomMid7  2.2s cubic-bezier(.25,.46,.45,.94) 1.15s forwards; animation: bloomMid7  2.2s cubic-bezier(.25,.46,.45,.94) 1.15s forwards; }
  .petal.mid:nth-child(18) { -webkit-animation: bloomMid8  2.2s cubic-bezier(.25,.46,.45,.94) 1.25s forwards; animation: bloomMid8  2.2s cubic-bezier(.25,.46,.45,.94) 1.25s forwards; }
  .petal.mid:nth-child(19) { -webkit-animation: bloomMid9  2.2s cubic-bezier(.25,.46,.45,.94) 1.35s forwards; animation: bloomMid9  2.2s cubic-bezier(.25,.46,.45,.94) 1.35s forwards; }
  .petal.mid:nth-child(20) { -webkit-animation: bloomMid10 2.2s cubic-bezier(.25,.46,.45,.94) 1.45s forwards; animation: bloomMid10 2.2s cubic-bezier(.25,.46,.45,.94) 1.45s forwards; }

  /* 花心 */
  .core {
    position: absolute; top: 50%; left: 50%;
    width: 46px; height: 46px;
    margin-top: -23px; margin-left: -23px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8e0, #ffd888 40%, #e8a850 100%);
    box-shadow: 0 0 20px rgba(255,200,120,0.5), inset 0 0 12px rgba(255,255,255,0.4);
    opacity: 0;
    -webkit-transform: scale(0);
    transform: scale(0);
    -webkit-animation: coreBloom 1.4s cubic-bezier(.34,1.56,.64,1) 1.4s forwards;
    animation: coreBloom 1.4s cubic-bezier(.34,1.56,.64,1) 1.4s forwards;
    z-index: 6;
  }
  .core::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,160,0.35) 0%, transparent 70%);
    -webkit-animation: coreGlow 3s ease-in-out infinite;
    animation: coreGlow 3s ease-in-out infinite;
  }

  /* 花粉点 */
  .pollen {
    position: absolute; top: 50%; left: 50%;
    width: 4px; height: 4px;
    margin-top: -2px; margin-left: -2px;
    border-radius: 50%; background: #d08040;
    z-index: 7;
    opacity: 0;
    -webkit-animation: pollenShow .8s ease-out 2s forwards;
    animation: pollenShow .8s ease-out 2s forwards;
  }

  /* 外层花瓣关键帧：从收拢到展开 */
  @-webkit-keyframes bloomOut1  { 0% { -webkit-transform: rotate(0deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(0deg) scale(1); opacity: .85; } }
  @keyframes bloomOut1  { 0% { transform: rotate(0deg) scale(0); opacity: 0; } 100% { transform: rotate(0deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut2  { 0% { -webkit-transform: rotate(36deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(36deg) scale(1); opacity: .85; } }
  @keyframes bloomOut2  { 0% { transform: rotate(36deg) scale(0); opacity: 0; } 100% { transform: rotate(36deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut3  { 0% { -webkit-transform: rotate(72deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(72deg) scale(1); opacity: .85; } }
  @keyframes bloomOut3  { 0% { transform: rotate(72deg) scale(0); opacity: 0; } 100% { transform: rotate(72deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut4  { 0% { -webkit-transform: rotate(108deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(108deg) scale(1); opacity: .85; } }
  @keyframes bloomOut4  { 0% { transform: rotate(108deg) scale(0); opacity: 0; } 100% { transform: rotate(108deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut5  { 0% { -webkit-transform: rotate(144deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(144deg) scale(1); opacity: .85; } }
  @keyframes bloomOut5  { 0% { transform: rotate(144deg) scale(0); opacity: 0; } 100% { transform: rotate(144deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut6  { 0% { -webkit-transform: rotate(180deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(180deg) scale(1); opacity: .85; } }
  @keyframes bloomOut6  { 0% { transform: rotate(180deg) scale(0); opacity: 0; } 100% { transform: rotate(180deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut7  { 0% { -webkit-transform: rotate(216deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(216deg) scale(1); opacity: .85; } }
  @keyframes bloomOut7  { 0% { transform: rotate(216deg) scale(0); opacity: 0; } 100% { transform: rotate(216deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut8  { 0% { -webkit-transform: rotate(252deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(252deg) scale(1); opacity: .85; } }
  @keyframes bloomOut8  { 0% { transform: rotate(252deg) scale(0); opacity: 0; } 100% { transform: rotate(252deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut9  { 0% { -webkit-transform: rotate(288deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(288deg) scale(1); opacity: .85; } }
  @keyframes bloomOut9  { 0% { transform: rotate(288deg) scale(0); opacity: 0; } 100% { transform: rotate(288deg) scale(1); opacity: .85; } }
  @-webkit-keyframes bloomOut10 { 0% { -webkit-transform: rotate(324deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(324deg) scale(1); opacity: .85; } }
  @keyframes bloomOut10 { 0% { transform: rotate(324deg) scale(0); opacity: 0; } 100% { transform: rotate(324deg) scale(1); opacity: .85; } }

  /* 中层花瓣关键帧 */
  @-webkit-keyframes bloomMid1  { 0% { -webkit-transform: rotate(18deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(18deg) scale(1); opacity: .9; } }
  @keyframes bloomMid1  { 0% { transform: rotate(18deg) scale(0); opacity: 0; } 100% { transform: rotate(18deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid2  { 0% { -webkit-transform: rotate(54deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(54deg) scale(1); opacity: .9; } }
  @keyframes bloomMid2  { 0% { transform: rotate(54deg) scale(0); opacity: 0; } 100% { transform: rotate(54deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid3  { 0% { -webkit-transform: rotate(90deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(90deg) scale(1); opacity: .9; } }
  @keyframes bloomMid3  { 0% { transform: rotate(90deg) scale(0); opacity: 0; } 100% { transform: rotate(90deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid4  { 0% { -webkit-transform: rotate(126deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(126deg) scale(1); opacity: .9; } }
  @keyframes bloomMid4  { 0% { transform: rotate(126deg) scale(0); opacity: 0; } 100% { transform: rotate(126deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid5  { 0% { -webkit-transform: rotate(162deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(162deg) scale(1); opacity: .9; } }
  @keyframes bloomMid5  { 0% { transform: rotate(162deg) scale(0); opacity: 0; } 100% { transform: rotate(162deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid6  { 0% { -webkit-transform: rotate(198deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(198deg) scale(1); opacity: .9; } }
  @keyframes bloomMid6  { 0% { transform: rotate(198deg) scale(0); opacity: 0; } 100% { transform: rotate(198deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid7  { 0% { -webkit-transform: rotate(234deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(234deg) scale(1); opacity: .9; } }
  @keyframes bloomMid7  { 0% { transform: rotate(234deg) scale(0); opacity: 0; } 100% { transform: rotate(234deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid8  { 0% { -webkit-transform: rotate(270deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(270deg) scale(1); opacity: .9; } }
  @keyframes bloomMid8  { 0% { transform: rotate(270deg) scale(0); opacity: 0; } 100% { transform: rotate(270deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid9  { 0% { -webkit-transform: rotate(306deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(306deg) scale(1); opacity: .9; } }
  @keyframes bloomMid9  { 0% { transform: rotate(306deg) scale(0); opacity: 0; } 100% { transform: rotate(306deg) scale(1); opacity: .9; } }
  @-webkit-keyframes bloomMid10 { 0% { -webkit-transform: rotate(342deg) scale(0); opacity: 0; } 100% { -webkit-transform: rotate(342deg) scale(1); opacity: .9; } }
  @keyframes bloomMid10 { 0% { transform: rotate(342deg) scale(0); opacity: 0; } 100% { transform: rotate(342deg) scale(1); opacity: .9; } }

  @-webkit-keyframes coreBloom {
    0% { -webkit-transform: scale(0); opacity: 0; }
    70% { -webkit-transform: scale(1.2); opacity: 1; }
    100% { -webkit-transform: scale(1); opacity: 1; }
  }
  @keyframes coreBloom {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @-webkit-keyframes coreGlow {
    0%,100% { -webkit-transform: scale(1); opacity: .6; }
    50% { -webkit-transform: scale(1.25); opacity: .3; }
  }
  @keyframes coreGlow {
    0%,100% { transform: scale(1); opacity: .6; }
    50% { transform: scale(1.25); opacity: .3; }
  }
  @-webkit-keyframes pollenShow {
    0% { opacity: 0; -webkit-transform: scale(0); }
    100% { opacity: 1; -webkit-transform: scale(1); }
  }
  @keyframes pollenShow {
    0% { opacity: 0; transform: scale(0); }
    100% { opacity: 1; transform: scale(1); }
  }

  .flower.popped {
    -webkit-animation: flowerPop .55s cubic-bezier(.2,.9,.3,1.2) forwards;
    animation: flowerPop .55s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @-webkit-keyframes flowerPop {
    0% { -webkit-transform: scale(1); opacity: 1; }
    40% { -webkit-transform: scale(1.25); opacity: .85; }
    100% { -webkit-transform: scale(0); opacity: 0; }
  }
  @keyframes flowerPop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.25); opacity: .85; }
    100% { transform: scale(0); opacity: 0; }
  }

  .ring {
    position: absolute; border-radius: 50%;
    pointer-events: none;
  }
  .ring-1 {
    top: -24px; left: -24px; right: -24px; bottom: -24px;
    border: 1.5px dashed rgba(255,200,220,0.35);
    -webkit-animation: spin 20s linear infinite;
    animation: spin 20s linear infinite;
  }
  .ring-2 {
    top: -52px; left: -52px; right: -52px; bottom: -52px;
    border: 1px solid rgba(184,168,232,0.2);
    -webkit-animation: spin 35s linear infinite reverse;
    animation: spin 35s linear infinite reverse;
  }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tap-hint {
    position: absolute; top:0; left:0; width:100%; height:100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 600;
    letter-spacing: 2px; font-family: "PingFang SC", sans-serif;
    text-shadow: 0 1px 8px rgba(90,58,168,0.4);
    pointer-events: none;
    z-index: 6;
    opacity: 0;
    -webkit-animation: hintPulse 2s ease-in-out 2.5s infinite;
    animation: hintPulse 2s ease-in-out 2.5s infinite;
  }
  @-webkit-keyframes hintPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
  @keyframes hintPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }

  /* 卡片 */
  .card-wrap {
    position: absolute; left: 50%; top: 50%;
    -webkit-transform: translate(-50%, -50%) scale(0.7);
    transform: translate(-50%, -50%) scale(0.7);
    width: 88%; max-width: 340px;
    opacity: 0; pointer-events: none;
    transition: opacity .6s cubic-bezier(.2,.9,.3,1), transform .6s cubic-bezier(.2,.9,.3,1.2);
    z-index: 10;
  }
  .card-wrap.show {
    opacity: 1;
    -webkit-transform: translate(-50%, -50%) scale(1);
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .card {
    background: -webkit-linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 32px 24px 24px;
    -webkit-box-shadow: 0 20px 60px rgba(90,58,168,0.5);
    box-shadow: 0 20px 60px rgba(90,58,168,0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background: -webkit-linear-gradient(left, transparent, #ffd1a8, #e8a8d8, #b8a8e8, transparent);
    background: linear-gradient(90deg, transparent, #ffd1a8, #e8a8d8, #b8a8e8, transparent);
    opacity: .6;
  }

  .card-kind {
    font-size: 11px; letter-spacing: 5px; color: #d8a8ff;
    margin-bottom: 16px; font-family: "PingFang SC", sans-serif;
  }
  .card-ico { font-size: 42px; margin-bottom: 12px; }
  .card-title {
    font-size: 20px; font-weight: 600; color: #fff;
    margin-bottom: 10px; letter-spacing: 1px;
    font-family: "PingFang SC", sans-serif;
  }
  .card-text {
    font-size: 15px; line-height: 1.85; color: #e0d4f0;
    white-space: pre-line;
  }
  .card-sub {
    font-size: 12px; color: #9a86c4; margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(184,168,232,0.15);
    font-family: "PingFang SC", sans-serif;
  }
  .card-sub:empty { display: none; }

  .actions {
    margin-top: 18px;
    display: -webkit-flex; display: flex;
    gap: 8px; -webkit-justify-content: center; justify-content: center;
    -webkit-flex-wrap: wrap; flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px; border: none; border-radius: 999px;
    background: -webkit-linear-gradient(left, #d8a8ff 0%, #8a6ac8 100%);
    background: linear-gradient(135deg, #d8a8ff 0%, #8a6ac8 100%);
    color: #fff; font-size: 13px; font-weight: 600;
    font-family: "PingFang SC", sans-serif;
    cursor: pointer;
    -webkit-box-shadow: 0 6px 16px rgba(138,106,200,0.35);
    box-shadow: 0 6px 16px rgba(138,106,200,0.35);
    transition: transform .15s;
  }

<script>

/* ===== 星空 ===== */
var canvas = document.getElementById('stars');
var ctx = canvas.getContext('2d');
var W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

var stars = [];
for (var i=0; i<150; i++){
  stars.push({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6 + 0.2,
    vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08,
    a: Math.random()*0.6 + 0.2,
    tw: Math.random()*Math.PI*2,
    tws: 0.02 + Math.random()*0.03
  });
}
var meteors = [];

function tick(){
  ctx.clearRect(0,0,W,H);
  for (var i=0; i<stars.length; i++){
    var s = stars[i];
    s.x += s.vx; s.y += s.vy;
    if (s.x<0) s.x=W; if (s.x>W) s.x=0;
    if (s.y<0) s.y=H; if (s.y>H) s.y=0;
    s.tw += s.tws;
    var alpha = s.a * (0.5 + 0.5*Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = alpha;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 流星
  if (Math.random() < 0.006 && meteors.length < 3) {
    meteors.push({
      x: Math.random()*W*0.6, y: Math.random()*H*0.3,
      vx: 6 + Math.random()*4, vy: 3 + Math.random()*2,
      len: 80 + Math.random()*60, a: 1
    });
  }
  for (var j = meteors.length - 1; j >= 0; j--) {
    var m = meteors[j];
    m.x += m.vx; m.y += m.vy; m.a -= 0.015;
    if (m.a <= 0 || m.x > W) { meteors.splice(j, 1); continue; }
    var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.len, m.y - m.len*0.5);
    grad.addColorStop(0, 'rgba(255,255,255,' + m.a + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.len, m.y - m.len*0.5);
    ctx.stroke();
  }
  requestAnimationFrame(tick);
}
tick();

/* ===== 入场动画 ===== */
setTimeout(function(){
  document.getElementById('sig').classList.add('show');

  welcomeEl.classList.add('show');

  bar.insertBefore(btn, document.querySelector('.counter'));
}, 300);

/* ===== 记忆系统 (localStorage) ===== */
var STORAGE_KEY = 'iris_memory_v1';
var memory = loadMemory();

function loadMemory(){
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    var m = s ? JSON.parse(s) : {};
    return {
      collected: m.collected || {},
      totalFlips: m.totalFlips || 0,
      visitCount: m.visitCount || 0,
      lastVisitTime: m.lastVisitTime || 0,
      lastCardIdx: m.lastCardIdx || -1
    };
  } catch(e) {
    return { collected: {}, totalFlips: 0, visitCount: 0, lastVisitTime: 0, lastCardIdx: -1 };
  }
}

function saveMemory(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(memory)); } catch(e) {}
}

function markVisit(){
  memory.visitCount++;
  memory.lastVisitTime = Date.now();
  saveMemory();
}

function getWelcomeText(){
  var visits = memory.visitCount;
  if (visits === 1) return '初次见面，请多指教 ✨';
  if (visits === 2) return '又见面了，很高兴你还来 🌸';
  if (visits === 3) return '第三次了，你是不是喜欢上这里了？ 😊';
  if (visits === 5) return '五连打卡！我开始期待每天见到你了 🥰';
  if (visits === 10) return '十次了！你是我的常客了 🎉';
  if (visits > 10) return '第 ' + visits + ' 次相遇，谢谢你一直陪着我 💞';
  var msgs = ['好久不见，想我了吗？ 💫', '欢迎回来，今天想翻哪张？ 🌙', '又见面啦，今天天气真好 🍃', '等你好久了，点一下吧 ✨'];
  return msgs[(visits - 1) % msgs.length];
}

function getLastVisitText(){
  if (!memory.lastVisitTime) return '';
  var diff = Date.now() - memory.lastVisitTime;
  var hours = Math.floor(diff / (1000 * 60 * 60));
  var days = Math.floor(hours / 24);
  if (days > 0) return '上次见面是 ' + days + ' 天前';
  if (hours > 0) return '上次见面是 ' + hours + ' 小时前';
  if (Math.floor(diff / 60000) > 0) return '上次见面是几分钟前';
  return '刚见过面，这么快又来啦';
}

var collected = memory.collected;
var currentIdx = -1;
var count = memory.totalFlips;
var lastIdx = memory.lastCardIdx;

markVisit();

/* ===== 交互 ===== */
var flower = document.getElementById('flower');
var flowerWrap = document.getElementById('flowerWrap');
var cardWrap = document.getElementById('cardWrap');
var cKind = document.getElementById('cKind');
var cIco = document.getElementById('cIco');
var cTitle = document.getElementById('cTitle');
var cText = document.getElementById('cText');
var cSub = document.getElementById('cSub');
var counter = document.getElementById('counter');
var nextBtn = document.getElementById('nextBtn');
var closeBtn = document.getElementById('closeBtn');
var viewCollectedBtn = document.getElementById('viewCollected');
var modal = document.getElementById('modal');
var modalClose = document.getElementById('modalClose');
var collectList = document.getElementById('collectList');
var collectedCount = document.getElementById('collectedCount');
var welcomeEl = null;

var busy = false;

function drawCard(){
  var idx;
  for (var tries = 0; tries < 8; tries++) {
    idx = Math.floor(Math.random() * CARDS.length);
    if (idx !== lastIdx) break;
  }
  lastIdx = idx;
  currentIdx = idx;
  memory.lastCardIdx = idx;
  memory.totalFlips++;
  // 自动收藏
  if (!memory.collected[idx]) {
    memory.collected[idx] = { time: Date.now() };
  }
  saveMemory();
  var c = CARDS[idx];
  cKind.textContent = c.kind;
  cIco.textContent = c.ico;
  cTitle.textContent = c.title || '';
  cTitle.style.display = c.title ? 'block' : 'none';
  cText.textContent = c.text;
  cSub.textContent = c.sub || '';
  count++;
  counter.textContent = '已翻开 ' + count + ' 张';
}

function burst(cx, cy){
  var colors = ['#ffd1a8','#e8a8d8','#b8a8e8','#a8d8ff','#fff5e8'];
  for (var i = 0; i < 40; i++) {
    (function(delay){
      setTimeout(function(){
        var ang = Math.random() * Math.PI * 2;
        var dist = 120 + Math.random() * 200;
        var b = document.createElement('div');
        b.className = 'burst';
        b.style.left = cx + 'px';
        b.style.top = cy + 'px';
        var size = 4 + Math.random()*5;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        var col = colors[Math.floor(Math.random()*colors.length)];
        b.style.background = col;
        b.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * dist + 80) + 'px');
        document.body.appendChild(b);
        setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 2600);
      }, delay);
    })(i * 20);
  }
}

function openOrb(){
  if (busy) return;
  busy = true;
  var rect = flower.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  // 标题和底部栏快速淡出
  document.getElementById('title').classList.add('hide');
  document.getElementById('sig').classList.add('hide');
  document.getElementById('welcome').classList.add('hide');
  document.querySelector('.bottom-bar').classList.add('hide');
  flower.classList.add('popped');
  burst(cx, cy);
  drawCard();
  setTimeout(function(){
    flowerWrap.style.display = 'none';
    cardWrap.classList.add('show');
    busy = false;
  }, 450);
}

function closeOrb(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    flowerWrap.style.display = '';
    flower.classList.remove('popped');
    // 标题和底部栏恢复
    document.getElementById('title').classList.remove('hide');
    document.getElementById('sig').classList.remove('hide');
    document.getElementById('welcome').classList.remove('hide');
    document.querySelector('.bottom-bar').classList.remove('hide');
    busy = false;
  }, 400);
}

// 点击光球（兼容桌面和移动端）
var lastTap = 0;
function handleOrbTap(e){
  if (e) e.preventDefault();
  var now = Date.now();
  if (now - lastTap < 500) return;
  lastTap = now;
  openOrb();
}
flower.addEventListener('click', function(e){ e.stopPropagation(); handleOrbTap(e); });
flower.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); handleOrbTap(e); }, {passive:false});

// 再翻一张
nextBtn.addEventListener('click', function(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    drawCard();
    var rect = cardWrap.getBoundingClientRect();
    burst(rect.left + rect.width/2, rect.top + rect.height/2);
    cardWrap.classList.add('show');
    busy = false;
  }, 350);
});

// 放回去
closeBtn.addEventListener('click', closeOrb);
closeBtn.addEventListener('touchend', function(e){ e.preventDefault(); closeOrb(); }, {passive:false});

// 收集册
viewCollectedBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', function(e){
  if (e.target === modal) closeModal();
});

function openModal(){
  renderCollectList();
  modal.style.display = 'flex';
  setTimeout(function(){
    modal.classList.add('show');
  }, 10);
}
function closeModal(){
  modal.classList.remove('show');
  setTimeout(function(){
    modal.style.display = 'none';
  }, 400);
}

function renderCollectList(){
  var n = 0;
  for (var k in memory.collected) n++;
  collectedCount.textContent = n + ' / ' + CARDS.length;
  collectList.innerHTML = '';
  if (n === 0) {
    collectList.innerHTML = '<div class="empty">还没收集到任何卡片<br>点光球翻第一张吧 ✨</div>';
    return;
  }
  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    var has = memory.collected[i];
    var item = document.createElement('div');
    item.className = 'collect-item' + (has ? '' : ' locked');
    var desc = c.title || c.text.split('\n')[0];
    item.innerHTML =
      '<div class="ci-ico">' + (has ? c.ico : '❓') + '</div>' +
      '<div class="ci-info">' +
        '<div class="ci-name">' + (has ? (c.title || c.kind) : '未解锁') + '</div>' +
        '<div class="ci-desc">' + (has ? desc : '继续翻开试试') + '</div>' +
      '</div>' +
      '<div class="ci-kind">' + c.kind + '</div>';
    if (has) {
      (function(idx){
        item.addEventListener('click', function(){
          // 点击已收藏的卡片，可以直接打开看
          closeModal();
          currentIdx = idx;
          lastIdx = idx;
          var card = CARDS[idx];
          cKind.textContent = card.kind;
          cIco.textContent = card.ico;
          cTitle.textContent = card.title || '';
          cTitle.style.display = card.title ? 'block' : 'none';
          cText.textContent = card.text;
          cSub.textContent = card.sub || '';
          updateCollectBtn();
          flowerWrap.style.display = 'none';
          cardWrap.classList.add('show');
        });
      })(i);
    }
    collectList.appendChild(item);
  }
}
</script>
</body>
</html>
