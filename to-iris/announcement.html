<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新公告 · 给 IRIS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1035 0%, #0d0820 55%, #060412 100%);
    color: #f0e8ff; min-height: 100vh;
    padding: 40px 20px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .head { text-align: center; margin-bottom: 32px; }
  .head .kicker {
    font-size: 11px; letter-spacing: 6px; color: #b8a8e8; margin-bottom: 12px;
  }
  .head h1 {
    font-size: 26px; font-weight: 600; letter-spacing: 3px; color: #e8d8ff;
  }
  .head .ver {
    display: inline-block; margin-top: 12px;
    font-size: 11px; color: #ffd8a8; letter-spacing: 2px;
    border: 1px solid rgba(255,200,120,0.35); border-radius: 999px;
    padding: 4px 14px; font-family: "PingFang SC", sans-serif;
  }
  .head .divider {
    width: 48px; height: 2px; margin: 20px auto 0;
    background: linear-gradient(90deg, transparent, #e8a8d8, transparent);
  }

  .card {
    background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.03) 100%);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    padding: 24px 22px;
    margin-bottom: 18px;
    box-shadow: 0 18px 50px rgba(90,58,168,0.35);
    overflow: hidden;
    position: relative;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, #ffd1a8, #e8a8d8, #b8a8e8, transparent);
    opacity: .6;
  }
  .card h2 {
    font-size: 16px; font-weight: 700; letter-spacing: 2px;
    font-family: "PingFang SC", sans-serif; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .tag {
    font-size: 9px; font-weight: 600; letter-spacing: 1px;
    padding: 2px 8px; border-radius: 999px;
  }
  .tag.opt { background: rgba(232,168,216,0.16); color: #e8a8ff; border: 1px solid rgba(232,168,216,0.3); }
  .tag.fix { background: rgba(100,160,255,0.16); color: #8ac8ff; border: 1px solid rgba(100,160,255,0.3); }

  ul { list-style: none; }
  li {
    position: relative; padding: 8px 0 8px 22px;
    font-size: 14px; line-height: 1.8; color: #e0d4f0;
  }
  li::before {
    content: '✦'; position: absolute; left: 2px; top: 9px;
    font-size: 10px; color: #d8a8ff; opacity: .8;
  }
  li b { color: #fff; font-weight: 600; }
  li .why { display:block; font-size: 12px; color: #9a86c4; }

  .back {
    display: block; text-align: center; margin-top: 8px;
  }
  .back a {
    display: inline-block; padding: 12px 34px; border-radius: 999px;
    background: linear-gradient(135deg, #d8a8ff 0%, #8a6ac8 100%);
    color: #fff; font-size: 14px; font-weight: 600; text-decoration: none;
    font-family: "PingFang SC", sans-serif;
    box-shadow: 0 6px 16px rgba(138,106,200,0.35);
    transition: transform .15s;
  }
  .back a:active { transform: scale(0.95); }
  .foot { text-align:center; margin-top: 28px; font-size: 11px; color: #7a6a9a; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="kicker">— TO IRIS —</div>
      <h1>更 新 公 告</h1>
      <div class="ver">✦ v1.1 · 2026.08.22 ✦</div>
      <div class="divider"></div>
    </div>

    <div class="card">
      <h2><span class="tag opt">体验优化</span></h2>
      <ul>
        <li><b>剧情解锁更及时</b><span class="why">到访时、限定抽卡后都会立即检查剧情条件，不再需要等到下次翻牌才解锁</span></li>
        <li><b>小屏适配</b><span class="why">矮屏手机上花朵与底部栏不再被裁切，排版更完整</span></li>
        <li><b>限定卡预告更准确</b><span class="why">跨年时不再显示「还有 0 天」，倒计时会正确顺延到下一年</span></li>
      </ul>
    </div>

    <div class="card">
      <h2><span class="tag fix">问题修复</span></h2>
      <ul>
        <li><b>抽签卡背面排版</b><span class="why">修复卡片背面的 ✦ 挤在左上角的问题，现在居中并有描边装饰</span></li>
        <li><b>收藏数据健壮性</b><span class="why">完善剧情记录等字段的初始化，避免极端情况下的数据异常</span></li>
      </ul>
    </div>

    <div class="back">
      <a href="index.html">← 回到小世界</a>
    </div>
    <div class="foot">愿你今天开心 ✨</div>
  </div>
</body>
</html>
