<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 IRIS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    background: radial-gradient(ellipse at 50% 30%, #1a1035 0%, #0d0820 55%, #060412 100%);
    color: #f0e8ff; min-height: 100vh;
    overflow: hidden;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position:fixed; top:0; left:0; right:0; bottom:0;
    display:block; pointer-events:none; z-index:0;
  }

  .stage {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    padding: 24px;
  }

  .signature {
    position: absolute; top: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 12px; letter-spacing: 6px; color: #b8a8e8;
    opacity: 0; transition: opacity 1s;
  }
  .signature.show { opacity: .8; }

  .title {
    font-size: 22px; font-weight: 500; letter-spacing: 3px;
    color: #e8d8ff; text-align: center;
    margin-bottom: 40px;
    opacity: 0;
    -webkit-transform: translateY(0);
    transform: translateY(0);
    transition: opacity .5s, transform .5s;
  }
  .title.show { opacity: 1; }
  .title.hide { opacity: 0; -webkit-transform: translateY(-20px); transform: translateY(-20px); }

  .signature {
    transition: opacity .5s, transform .5s;
  }
  .signature.hide { opacity: 0 !important; -webkit-transform: translateY(-10px); transform: translateY(-10px); }

  .orb-wrap {
    position: relative; width: 200px; height: 200px;
    margin-bottom: 36px;
    opacity: 0; -webkit-transform: scale(0.8); transform: scale(0.8);
    transition: opacity 1.2s .6s, transform 1.2s .6s cubic-bezier(.2,.9,.3,1.2);
  }
  .orb-wrap.show { opacity: 1; -webkit-transform: scale(1); transform: scale(1); }

  .orb {
    position: absolute; top:0; left:0; width:100%; height:100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #fff5e8 0%, #ffd1a8 18%, #e8a8d8 40%, #a888e0 65%, #5a3aa8 85%, transparent 100%);
    -webkit-box-shadow: 0 0 40px rgba(184,168,232,0.5), 0 0 100px rgba(232,168,216,0.35), inset 0 0 30px rgba(255,255,255,0.3);
    box-shadow: 0 0 40px rgba(184,168,232,0.5), 0 0 100px rgba(232,168,216,0.35), inset 0 0 30px rgba(255,255,255,0.3);
    cursor: pointer;
    -webkit-animation: breath 4s ease-in-out infinite;
    animation: breath 4s ease-in-out infinite;
    transition: transform .15s;
    z-index: 5;
  }
  .orb:active { -webkit-transform: scale(0.94); transform: scale(0.94); }
  .orb.popped {
    -webkit-animation: pop .6s cubic-bezier(.2,.9,.3,1.2) forwards;
    animation: pop .6s cubic-bezier(.2,.9,.3,1.2) forwards;
  }

  @-webkit-keyframes breath {
    0%,100% { -webkit-transform: scale(1); -webkit-filter: hue-rotate(0deg);
      -webkit-box-shadow: 0 0 40px rgba(184,168,232,0.5), 0 0 100px rgba(232,168,216,0.35), inset 0 0 30px rgba(255,255,255,0.3); }
    50% { -webkit-transform: scale(1.07); -webkit-filter: hue-rotate(15deg);
      -webkit-box-shadow: 0 0 60px rgba(184,168,232,0.7), 0 0 140px rgba(232,168,216,0.5), inset 0 0 40px rgba(255,255,255,0.4); }
  }
  @keyframes breath {
    0%,100% { transform: scale(1); filter: hue-rotate(0deg);
      box-shadow: 0 0 40px rgba(184,168,232,0.5), 0 0 100px rgba(232,168,216,0.35), inset 0 0 30px rgba(255,255,255,0.3); }
    50% { transform: scale(1.07); filter: hue-rotate(15deg);
      box-shadow: 0 0 60px rgba(184,168,232,0.7), 0 0 140px rgba(232,168,216,0.5), inset 0 0 40px rgba(255,255,255,0.4); }
  }
  @-webkit-keyframes pop {
    0% { -webkit-transform: scale(1); opacity: 1; }
    40% { -webkit-transform: scale(1.3); opacity: .8; }
    100% { -webkit-transform: scale(0.2); opacity: 0; }
  }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.3); opacity: .8; }
    100% { transform: scale(0.2); opacity: 0; }
  }

  .ring {
    position: absolute; border-radius: 50%;
    pointer-events: none;
  }
  .ring-1 {
    top: -18px; left: -18px; right: -18px; bottom: -18px;
    border: 1.5px dashed rgba(255,200,220,0.35);
    -webkit-animation: spin 20s linear infinite;
    animation: spin 20s linear infinite;
  }
  .ring-2 {
    top: -42px; left: -42px; right: -42px; bottom: -42px;
    border: 1px solid rgba(184,168,232,0.2);
    -webkit-animation: spin 35s linear infinite reverse;
    animation: spin 35s linear infinite reverse;
  }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tap-hint {
    position: absolute; top:0; left:0; width:100%; height:100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 600;
    letter-spacing: 2px; font-family: "PingFang SC", sans-serif;
    text-shadow: 0 1px 8px rgba(90,58,168,0.4);
    pointer-events: none;
    z-index: 6;
    -webkit-animation: hintPulse 2s ease-in-out infinite;
    animation: hintPulse 2s ease-in-out infinite;
  }
  @-webkit-keyframes hintPulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
  @keyframes hintPulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }

  /* 卡片 */
  .card-wrap {
    position: absolute; left: 50%; top: 50%;
    -webkit-transform: translate(-50%, -50%) scale(0.7);
    transform: translate(-50%, -50%) scale(0.7);
    width: 88%; max-width: 340px;
    opacity: 0; pointer-events: none;
    transition: opacity .6s cubic-bezier(.2,.9,.3,1), transform .6s cubic-bezier(.2,.9,.3,1.2);
    z-index: 10;
  }
  .card-wrap.show {
    opacity: 1;
    -webkit-transform: translate(-50%, -50%) scale(1);
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .card {
    background: -webkit-linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 24px;
    padding: 32px 24px 24px;
    -webkit-box-shadow: 0 20px 60px rgba(90,58,168,0.5);
    box-shadow: 0 20px 60px rgba(90,58,168,0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background: -webkit-linear-gradient(left, transparent, #ffd1a8, #e8a8d8, #b8a8e8, transparent);
    background: linear-gradient(90deg, transparent, #ffd1a8, #e8a8d8, #b8a8e8, transparent);
    opacity: .6;
  }

  .card-kind {
    font-size: 11px; letter-spacing: 5px; color: #d8a8ff;
    margin-bottom: 16px; font-family: "PingFang SC", sans-serif;
  }
  .card-ico { font-size: 42px; margin-bottom: 12px; }
  .card-title {
    font-size: 20px; font-weight: 600; color: #fff;
    margin-bottom: 10px; letter-spacing: 1px;
    font-family: "PingFang SC", sans-serif;
  }
  .card-text {
    font-size: 15px; line-height: 1.85; color: #e0d4f0;
    white-space: pre-line;
  }
  .card-sub {
    font-size: 12px; color: #9a86c4; margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(184,168,232,0.15);
    font-family: "PingFang SC", sans-serif;
  }
  .card-sub:empty { display: none; }

  .actions {
    margin-top: 18px;
    display: -webkit-flex; display: flex;
    gap: 8px; -webkit-justify-content: center; justify-content: center;
    -webkit-flex-wrap: wrap; flex-wrap: wrap;
  }
  .btn {
    padding: 10px 18px; border: none; border-radius: 999px;
    background: -webkit-linear-gradient(left, #d8a8ff 0%, #8a6ac8 100%);
    background: linear-gradient(135deg, #d8a8ff 0%, #8a6ac8 100%);
    color: #fff; font-size: 13px; font-weight: 600;
    font-family: "PingFang SC", sans-serif;
    cursor: pointer;
    -webkit-box-shadow: 0 6px 16px rgba(138,106,200,0.35);
    box-shadow: 0 6px 16px rgba(138,106,200,0.35);
    transition: transform .15s;
  }
  .btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
  .btn.ghost {
    background: transparent;
    border: 1.5px solid rgba(184,168,232,0.4);
    -webkit-box-shadow: none; box-shadow: none;
  }

  /* 底部栏 */
  .bottom-bar {
    position: absolute; bottom: 32px; left: 0; right: 0;
    display: -webkit-flex; display: flex;
    -webkit-justify-content: center; justify-content: center;
    -webkit-align-items: center; align-items: center;
    gap: 12px;
    font-family: "PingFang SC", sans-serif;
    transition: opacity .4s, transform .4s;
  }
  .bottom-bar.hide { opacity: 0; -webkit-transform: translateY(16px); transform: translateY(16px); pointer-events: none; }
  .counter {
    font-size: 11px; color: #7a6a9a;
    letter-spacing: 3px;
    opacity: 0; transition: opacity 1s 1.2s;
  }
  .counter.show { opacity: .7; }
  .collect-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(184,168,232,0.25);
    color: #d8c8ff;
    padding: 6px 14px; border-radius: 999px;
    font-size: 11px; letter-spacing: 1px;
    cursor: pointer; font-family: inherit;
    opacity: 0; transition: opacity 1s 1.3s;
  }
  .collect-btn.show { opacity: .9; }
  .collect-btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); }

  /* 收集册弹层 */
  .modal {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(6,4,18,0.85);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    -webkit-align-items: flex-end; align-items: flex-end;
    -webkit-justify-content: center; justify-content: center;
  }
  .modal.show { display: -webkit-flex; display: flex; }
  .modal-inner {
    width: 100%; max-width: 480px;
    background: -webkit-linear-gradient(180deg, rgba(30,20,56,0.95) 0%, rgba(18,12,36,0.98) 100%);
    background: linear-gradient(180deg, rgba(30,20,56,0.95) 0%, rgba(18,12,36,0.98) 100%);
    border: 1px solid rgba(184,168,232,0.2);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 28px;
    max-height: 80vh;
    overflow-y: auto;
    -webkit-transform: translateY(100%); transform: translateY(100%);
    transition: transform .4s cubic-bezier(.2,.9,.3,1);
  }
  .modal.show .modal-inner { -webkit-transform: translateY(0); transform: translateY(0); }

  .modal-header {
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: center; align-items: center;
    margin-bottom: 16px;
  }
  .modal-title {
    font-size: 16px; font-weight: 700; color: #e8d8ff;
    font-family: "PingFang SC", sans-serif;
  }
  .modal-title small {
    display: block; font-size: 10px; color: #7a6a9a;
    letter-spacing: 2px; font-weight: 400; margin-top: 2px;
  }
  .modal-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none; color: #d8c8ff;
    font-size: 16px; cursor: pointer;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }

  .collect-list {
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    gap: 8px;
  }
  .collect-item {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(184,168,232,0.12);
    border-radius: 14px;
  }
  .collect-item.locked { opacity: 0.35; }
  .ci-ico { font-size: 24px; width: 36px; text-align: center; }
  .ci-info { -webkit-flex: 1; flex: 1; min-width: 0; }
  .ci-name { font-size: 14px; font-weight: 600; color: #f0e8ff; font-family: "PingFang SC", sans-serif; }
  .ci-desc {
    font-size: 11px; color: #9a86c4; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: "PingFang SC", sans-serif;
  }
  .ci-kind {
    font-size: 9px; color: #b8a8e8;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(184,168,232,0.15);
    font-family: "PingFang SC", sans-serif;
    letter-spacing: 1px;
  }

  .empty {
    text-align: center; padding: 40px 20px;
    color: #7a6a9a; font-size: 13px;
    font-family: "PingFang SC", sans-serif;
  }

  /* 爆裂粒子 */
  .burst {
    position: fixed; pointer-events: none; z-index: 50;
    border-radius: 50%;
    -webkit-animation: burstFly 2.4s ease-out forwards;
    animation: burstFly 2.4s ease-out forwards;
  }
  @-webkit-keyframes burstFly {
    0% { opacity: 1; -webkit-transform: translate(0, 0) scale(1); }
    100% { opacity: 0; -webkit-transform: translate(var(--dx), var(--dy)) scale(0.2); }
  }
  @keyframes burstFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="stage">
    <div class="signature" id="sig">— to IRIS —</div>

    <div class="title" id="title">点一下光</div>

    <div class="orb-wrap" id="orbWrap">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="orb" id="orb">
        <div class="tap-hint">轻 触</div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="counter" id="counter">已翻开 0 张</div>
    </div>
  </div>

  <!-- 卡片 -->
  <div class="card-wrap" id="cardWrap">
    <div class="card">
      <div class="card-kind" id="cKind">—</div>
      <div class="card-ico" id="cIco">✨</div>
      <div class="card-title" id="cTitle">—</div>
      <div class="card-text" id="cText">—</div>
      <div class="card-sub" id="cSub"></div>
      <div class="actions">
        <button class="btn ghost" id="collectBtn">收 藏 ✦</button>
        <button class="btn" id="nextBtn">再翻一张 ↻</button>
      </div>
      <div class="actions" style="margin-top:10px;">
        <button class="btn ghost" id="closeBtn" style="font-size:13px; padding:10px 22px; min-width:100px;">← 放回去</button>
        <button class="btn ghost" id="viewCollected" style="font-size:11px; padding:6px 14px;">看收藏册</button>
      </div>
    </div>
  </div>

  <!-- 收集册弹层 -->
  <div class="modal" id="modal">
    <div class="modal-inner">
      <div class="modal-header">
        <div class="modal-title">
          收集册
          <small id="collectedCount">0 / 22</small>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="collect-list" id="collectList"></div>
    </div>
  </div>

<script>
/* ===== 卡片内容库 ===== */
var CARDS = [
  // 一句心意 (7)
  { kind:'一句心意', ico:'💫', title:'', text:'IRIS，你知道吗，\n光是想起你的名字，\n今天就变得比昨天好一点了。', sub:'' },
  { kind:'一句心意', ico:'🌙', title:'', text:'月亮不会奔向你，\n但我会。\n不远万里的那种。', sub:'' },
  { kind:'一句心意', ico:'🌸', title:'', text:'如果是去见你，\n我一定是用跑的。\n你不用跑，我来就好。', sub:'' },
  { kind:'一句心意', ico:'⭐', title:'', text:'你是我藏在星星里的浪漫，\n是我等了好久的光。', sub:'' },
  { kind:'一句心意', ico:'🍃', title:'', text:'风很温柔，花很浪漫，\n你很特别，我很喜欢。', sub:'' },
  { kind:'一句心意', ico:'✨', title:'', text:'遇见你以后，\n我所有的"随便"，\n其实都是"只要你在就好"。', sub:'' },
  { kind:'一句心意', ico:'🦋', title:'', text:'你身上有光，\n我抓来看看，\n然后就不想放了。', sub:'' },
  // 今天去哪儿 (9)
  { kind:'今天去哪儿', ico:'⛩️', title:'寺庙祈福', text:'一起去庙里走一圈吧，\n不求别的，\n就求你今天开开心心。', sub:'挑个下午，人少的时候去最舒服' },
  { kind:'今天去哪儿', ico:'🦎', title:'异宠店', text:'去看那些奇奇怪怪的小家伙吧，\n蜥蜴、守宫、角蛙……\n看看你敢不敢摸一下。', sub:'记得问店员能不能上手，别偷偷摸' },
  { kind:'今天去哪儿', ico:'⛰️', title:'岳麓山', text:'上山！\n爱晚亭坐一会儿，\n看日落慢慢把天染成橘色。', sub:'下午3点出发，刚好赶上日落' },
  { kind:'今天去哪儿', ico:'🎨', title:'湖南美术馆', text:'看展去。\n不用懂，\n就一起慢慢逛，假装很文艺。', sub:'记得提前预约，周一别去' },
  { kind:'今天去哪儿', ico:'📷', title:'谢子龙影像馆', text:'拍照圣地，\n给你拍一组好看的，\n朋友圈有素材了。', sub:'下午光线最棒，穿浅色更出片' },
  { kind:'今天去哪儿', ico:'☕', title:'泊麓山咖啡书吧', text:'找个靠窗位置，\n各看各的书，\n偶尔抬头对视一下就好。', sub:'4楼有山景位，先到先得' },
  { kind:'今天去哪儿', ico:'🍜', title:'麓山南觅食', text:'从头吃到尾，\n糖油粑粑、臭豆腐、烤冷面……\n我请客，你负责吃。', sub:'别吃太饱，后面还有好几家' },
  { kind:'今天去哪儿', ico:'🌊', title:'橘子洲散步', text:'湘江边走一走，\n吹吹风，\n什么烦恼都没了。', sub:'建议坐观光车，走完全程腿会废' },
  { kind:'今天去哪儿', ico:'📖', title:'止间书店', text:'安静的一下午，\n一本书，一杯咖啡，\n还有你。', sub:'二楼有咖啡区，更安静' },
  // 小小挑战 (6)
  { kind:'小小挑战', ico:'🎯', title:'对视十秒', text:'现在，\n看着我的眼睛，\n不许笑，不许躲。\n……\n好，你输了。', sub:'输了的人请喝奶茶' },
  { kind:'小小挑战', ico:'🎵', title:'猜歌名', text:'我哼一句，\n你猜是什么歌。\n猜不出来就……\n让我弹你脑门一下。', sub:'我跑调了你也得猜' },
  { kind:'小小挑战', ico:'📸', title:'拍一张奇怪的合照', text:'做个最丑的表情，\n三二一，咔嚓。\n这张照片我存了。', sub:'不许删，以后要拿来笑你' },
  { kind:'小小挑战', ico:'🤫', title:'用眼神对话', text:'接下来一分钟，\n谁都不许说话，\n只用眼神交流。\n看看你能不能猜到我在想什么。', sub:'提示：我想的一定是好吃的' },
  { kind:'小小挑战', ico:'🎲', title:'真心话大冒险', text:'石头剪刀布，\n输的人选一个：\n真心话还是大冒险？', sub:'我先来，我选……你猜' },
  { kind:'小小挑战', ico:'🍬', title:'分享耳机', text:'一人一只耳机，\n听同一首歌，\n什么都不说也挺好。', sub:'我推荐的歌不许说难听' }
];

/* ===== 星空 ===== */
var canvas = document.getElementById('stars');
var ctx = canvas.getContext('2d');
var W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

var stars = [];
for (var i=0; i<150; i++){
  stars.push({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6 + 0.2,
    vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08,
    a: Math.random()*0.6 + 0.2,
    tw: Math.random()*Math.PI*2,
    tws: 0.02 + Math.random()*0.03
  });
}
var meteors = [];

function tick(){
  ctx.clearRect(0,0,W,H);
  for (var i=0; i<stars.length; i++){
    var s = stars[i];
    s.x += s.vx; s.y += s.vy;
    if (s.x<0) s.x=W; if (s.x>W) s.x=0;
    if (s.y<0) s.y=H; if (s.y>H) s.y=0;
    s.tw += s.tws;
    var alpha = s.a * (0.5 + 0.5*Math.sin(s.tw));
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = alpha;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 流星
  if (Math.random() < 0.006 && meteors.length < 3) {
    meteors.push({
      x: Math.random()*W*0.6, y: Math.random()*H*0.3,
      vx: 6 + Math.random()*4, vy: 3 + Math.random()*2,
      len: 80 + Math.random()*60, a: 1
    });
  }
  for (var j = meteors.length - 1; j >= 0; j--) {
    var m = meteors[j];
    m.x += m.vx; m.y += m.vy; m.a -= 0.015;
    if (m.a <= 0 || m.x > W) { meteors.splice(j, 1); continue; }
    var grad = ctx.createLinearGradient(m.x, m.y, m.x - m.len, m.y - m.len*0.5);
    grad.addColorStop(0, 'rgba(255,255,255,' + m.a + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.len, m.y - m.len*0.5);
    ctx.stroke();
  }
  requestAnimationFrame(tick);
}
tick();

/* ===== 入场动画 ===== */
setTimeout(function(){
  document.getElementById('sig').classList.add('show');
  document.getElementById('title').classList.add('show');
  document.getElementById('orbWrap').classList.add('show');
  document.getElementById('counter').classList.add('show');
  // 底部加个"看收藏"按钮
  var bar = document.querySelector('.bottom-bar');
  var btn = document.createElement('button');
  btn.className = 'collect-btn show';
  btn.id = 'viewCollectedBottom';
  btn.textContent = '✦ 收集册';
  btn.addEventListener('click', openModal);
  bar.insertBefore(btn, document.querySelector('.counter'));
}, 300);

/* ===== 收集系统 (localStorage) ===== */
var STORAGE_KEY = 'iris_collected_v1';
function getCollected(){
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : {};
  } catch(e) { return {}; }
}
function saveCollected(obj){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch(e) {}
}
var collected = getCollected();
var currentIdx = -1;
var count = 0;
var lastIdx = -1;

/* ===== 交互 ===== */
var orb = document.getElementById('orb');
var orbWrap = document.getElementById('orbWrap');
var cardWrap = document.getElementById('cardWrap');
var cKind = document.getElementById('cKind');
var cIco = document.getElementById('cIco');
var cTitle = document.getElementById('cTitle');
var cText = document.getElementById('cText');
var cSub = document.getElementById('cSub');
var counter = document.getElementById('counter');
var nextBtn = document.getElementById('nextBtn');
var closeBtn = document.getElementById('closeBtn');
var collectBtn = document.getElementById('collectBtn');
var viewCollectedBtn = document.getElementById('viewCollected');
var modal = document.getElementById('modal');
var modalClose = document.getElementById('modalClose');
var collectList = document.getElementById('collectList');
var collectedCount = document.getElementById('collectedCount');

var busy = false;

function drawCard(){
  var idx;
  for (var tries = 0; tries < 8; tries++) {
    idx = Math.floor(Math.random() * CARDS.length);
    if (idx !== lastIdx) break;
  }
  lastIdx = idx;
  currentIdx = idx;
  var c = CARDS[idx];
  cKind.textContent = c.kind;
  cIco.textContent = c.ico;
  cTitle.textContent = c.title || '';
  cTitle.style.display = c.title ? 'block' : 'none';
  cText.textContent = c.text;
  cSub.textContent = c.sub || '';
  count++;
  counter.textContent = '已翻开 ' + count + ' 张';
  // 收藏按钮状态
  updateCollectBtn();
}

function updateCollectBtn(){
  if (currentIdx < 0) return;
  var isCollected = collected[currentIdx];
  collectBtn.textContent = isCollected ? '已收藏 ✓' : '收 藏 ✦';
  collectBtn.disabled = !!isCollected;
  collectBtn.style.opacity = isCollected ? '0.6' : '1';
}

function burst(cx, cy){
  var colors = ['#ffd1a8','#e8a8d8','#b8a8e8','#a8d8ff','#fff5e8'];
  for (var i = 0; i < 40; i++) {
    (function(delay){
      setTimeout(function(){
        var ang = Math.random() * Math.PI * 2;
        var dist = 120 + Math.random() * 200;
        var b = document.createElement('div');
        b.className = 'burst';
        b.style.left = cx + 'px';
        b.style.top = cy + 'px';
        var size = 4 + Math.random()*5;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        var col = colors[Math.floor(Math.random()*colors.length)];
        b.style.background = col;
        b.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
        b.style.setProperty('--dy', (Math.sin(ang) * dist + 80) + 'px');
        document.body.appendChild(b);
        setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 2600);
      }, delay);
    })(i * 20);
  }
}

function openOrb(){
  if (busy) return;
  busy = true;
  var rect = orb.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  // 标题和底部栏快速淡出
  document.getElementById('title').classList.add('hide');
  document.getElementById('sig').classList.add('hide');
  document.querySelector('.bottom-bar').classList.add('hide');
  orb.classList.add('popped');
  burst(cx, cy);
  drawCard();
  setTimeout(function(){
    orbWrap.style.display = 'none';
    cardWrap.classList.add('show');
    busy = false;
  }, 450);
}

function closeOrb(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    orbWrap.style.display = '';
    orb.classList.remove('popped');
    // 标题和底部栏恢复
    document.getElementById('title').classList.remove('hide');
    document.getElementById('sig').classList.remove('hide');
    document.querySelector('.bottom-bar').classList.remove('hide');
    busy = false;
  }, 400);
}

// 点击光球（兼容桌面和移动端）
var lastTap = 0;
function handleOrbTap(e){
  if (e) e.preventDefault();
  var now = Date.now();
  if (now - lastTap < 500) return;
  lastTap = now;
  openOrb();
}
orb.addEventListener('click', function(e){ e.stopPropagation(); handleOrbTap(e); });
orb.addEventListener('touchend', function(e){ e.preventDefault(); e.stopPropagation(); handleOrbTap(e); }, {passive:false});

// 再翻一张
nextBtn.addEventListener('click', function(){
  if (busy) return;
  busy = true;
  cardWrap.classList.remove('show');
  setTimeout(function(){
    drawCard();
    var rect = cardWrap.getBoundingClientRect();
    burst(rect.left + rect.width/2, rect.top + rect.height/2);
    cardWrap.classList.add('show');
    busy = false;
  }, 350);
});

// 放回去
closeBtn.addEventListener('click', closeOrb);
closeBtn.addEventListener('touchend', function(e){ e.preventDefault(); closeOrb(); }, {passive:false});

// 收藏
collectBtn.addEventListener('click', function(){
  if (currentIdx < 0) return;
  if (collected[currentIdx]) return;
  collected[currentIdx] = { time: Date.now() };
  saveCollected(collected);
  updateCollectBtn();
  // 小撒花
  var rect = collectBtn.getBoundingClientRect();
  burst(rect.left + rect.width/2, rect.top + rect.height/2);
});

// 收集册
viewCollectedBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', function(e){
  if (e.target === modal) closeModal();
});

function openModal(){
  renderCollectList();
  modal.classList.add('show');
  setTimeout(function(){
    modal.style.alignItems = 'center';
    modal.style.display = 'flex';
  }, 10);
}
function closeModal(){
  modal.classList.remove('show');
}

function renderCollectList(){
  var n = 0;
  for (var k in collected) n++;
  collectedCount.textContent = n + ' / ' + CARDS.length;
  collectList.innerHTML = '';
  if (n === 0) {
    collectList.innerHTML = '<div class="empty">还没收集到任何卡片<br>点光球翻第一张吧 ✨</div>';
    return;
  }
  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    var has = collected[i];
    var item = document.createElement('div');
    item.className = 'collect-item' + (has ? '' : ' locked');
    var desc = c.title || c.text.split('\n')[0];
    item.innerHTML =
      '<div class="ci-ico">' + (has ? c.ico : '❓') + '</div>' +
      '<div class="ci-info">' +
        '<div class="ci-name">' + (has ? (c.title || c.kind) : '未解锁') + '</div>' +
        '<div class="ci-desc">' + (has ? desc : '继续翻开试试') + '</div>' +
      '</div>' +
      '<div class="ci-kind">' + c.kind + '</div>';
    if (has) {
      (function(idx){
        item.addEventListener('click', function(){
          // 点击已收藏的卡片，可以直接打开看
          closeModal();
          currentIdx = idx;
          lastIdx = idx;
          var card = CARDS[idx];
          cKind.textContent = card.kind;
          cIco.textContent = card.ico;
          cTitle.textContent = card.title || '';
          cTitle.style.display = card.title ? 'block' : 'none';
          cText.textContent = card.text;
          cSub.textContent = card.sub || '';
          updateCollectBtn();
          orbWrap.style.display = 'none';
          cardWrap.classList.add('show');
        });
      })(i);
    }
    collectList.appendChild(item);
  }
}
</script>
</body>
</html>
